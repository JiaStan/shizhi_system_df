<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>园区地图 - 试制资源数智化管理系统</title>
  <link rel="stylesheet" href="./assets/css/theme.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
  <script src="https://unpkg.com.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
  <style>
    .toast-container{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px}
    .toast{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--bg-card);border:1px solid var(--border-color);border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,0.4);min-width:280px;animation:slideIn .3s ease}
    @keyframes slideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
    .toast.success{border-left:3px solid var(--success)}.toast.error{border-left:3px solid var(--danger)}
    .toast.warning{border-left:3px solid var(--warning)}.toast.info{border-left:3px solid var(--brand-primary)}
    .toast-icon{flex-shrink:0}.toast.success .toast-icon{color:var(--success)}.toast.error .toast-icon{color:var(--danger)}
    .toast.warning .toast-icon{color:var(--warning)}.toast.info .toast-icon{color:var(--brand-primary)}
    .toast-icon i{width:20px;height:20px}.toast-body{flex:1}
    .toast-title{font-size:13px;font-weight:600;color:var(--text-primary)}
    .toast-msg{font-size:12px;color:var(--text-secondary);margin-top:2px}
    .toast .close-btn{color:var(--text-muted);cursor:pointer}.toast .close-btn:hover{color:var(--text-primary)}
    .modal-mask{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;z-index:9998}
    .modal-mask.show{display:flex}
    .modal{background:var(--bg-card);border:1px solid var(--border-color);border-radius:12px;width:90%;max-width:560px;max-height:80vh;overflow:hidden;display:flex;flex-direction:column}
    .modal-header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border-color)}
    .modal-header h3{font-size:16px;font-weight:600;color:var(--text-primary)}
    .modal-close{background:none;border:none;color:var(--text-secondary);cursor:pointer;padding:4px;border-radius:4px;display:flex}
    .modal-close:hover{background:var(--bg-hover);color:var(--text-primary)}
    .modal-body{padding:20px;overflow-y:auto;flex:1}
    .modal-footer{padding:14px 20px;border-top:1px solid var(--border-color);display:flex;justify-content:flex-end;gap:10px}
    .btn{padding:8px 18px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .2s}
    .btn-primary{background:var(--brand-primary);color:white}.btn-primary:hover{background:var(--brand-light)}
    .btn-ghost{background:transparent;color:var(--text-secondary);border:1px solid var(--border-color)}
    .btn-ghost:hover{color:var(--text-primary);border-color:var(--text-muted)}

    .campus-map-wrapper{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(ellipse at center,#0F1524 0%,#06091A 100%)}
    .campus-svg{width:100%;height:100%;cursor:grab;user-select:none}
    .campus-svg:active{cursor:grabbing}
    .grid-bg{stroke:rgba(22,119,255,0.08);stroke-width:.5;fill:none}
    .building{cursor:pointer;transition:all .25s ease;stroke-width:1.5}
    .building:hover{stroke-width:2.5;filter:url(#glow)}
    .building.selected{stroke:#fff!important;stroke-width:2.5!important;filter:url(#glow)}
    .building-label{font-size:11px;fill:#E6F4FF;pointer-events:none;font-weight:500}
    .leader-line{stroke:rgba(22,119,255,0.6);stroke-width:1;stroke-dasharray:3 3;fill:none;pointer-events:none}
    .road{fill:#1A2335;stroke:#2A3550;stroke-width:1}
    .road-center{stroke:rgba(250,173,20,0.3);stroke-width:1;stroke-dasharray:8 6;fill:none}
    .green-area{fill:rgba(82,196,26,0.08);stroke:rgba(82,196,26,0.25);stroke-width:1}
    .tree{fill:rgba(82,196,26,0.4);stroke:rgba(82,196,26,0.6);stroke-width:.5}
    .water{fill:rgba(22,119,255,0.12);stroke:rgba(22,119,255,0.3);stroke-width:1}
    .equipment-marker{cursor:pointer;transition:all .2s}
    .equipment-marker:hover{filter:brightness(1.3)}
    .personnel-dot{cursor:pointer;animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{opacity:.85}50%{opacity:1}}

    .map-tooltip{position:absolute;background:rgba(21,28,44,0.97);border:1px solid var(--brand-primary);border-radius:8px;padding:10px 14px;min-width:180px;box-shadow:0 8px 32px rgba(0,0,0,0.5);pointer-events:none;z-index:50;display:none}
    .map-tooltip.show{display:block}
    .map-tooltip-title{font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--border-color)}
    .map-tooltip-row{display:flex;justify-content:space-between;font-size:12px;color:var(--text-secondary);margin:2px 0}
    .map-tooltip-row span:last-child{color:var(--text-primary)}

    .map-controls{position:absolute;top:16px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:20}
    .map-ctrl-btn{width:40px;height:40px;background:rgba(21,28,44,0.9);border:1px solid var(--border-color);border-radius:8px;color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
    .map-ctrl-btn:hover{color:var(--brand-light);border-color:var(--brand-primary);background:rgba(22,119,255,0.1)}

    .map-layer-panel{position:absolute;top:16px;left:16px;background:rgba(21,28,44,0.92);border:1px solid var(--border-color);border-radius:10px;padding:14px;min-width:180px;z-index:20;backdrop-filter:blur(10px)}
    .layer-title{font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;font-weight:600}
    .layer-toggle{display:flex;align-items:center;justify-content:space-between;padding:6px 0;cursor:pointer;color:var(--text-secondary);font-size:13px;transition:color .2s}
    .layer-toggle:hover{color:var(--text-primary)}.layer-toggle.active{color:var(--brand-light)}
    .layer-switch{width:32px;height:18px;background:var(--bg-hover);border-radius:10px;position:relative;transition:background .2s}
    .layer-switch::after{content:'';position:absolute;width:14px;height:14px;background:var(--text-muted);border-radius:50%;top:2px;left:2px;transition:all .2s}
    .layer-toggle.active .layer-switch{background:var(--brand-primary)}
    .layer-toggle.active .layer-switch::after{background:#fff;left:16px}

    .info-panel{position:absolute;bottom:16px;right:16px;width:320px;max-height:calc(100% - 120px);background:rgba(21,28,44,0.95);border:1px solid var(--border-color);border-radius:12px;backdrop-filter:blur(10px);z-index:20;display:flex;flex-direction:column;overflow:hidden}
    .info-panel-header{padding:14px 16px;border-bottom:1px solid var(--border-color);display:flex;align-items:center;justify-content:space-between}
    .info-panel-title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:var(--text-primary)}
    .info-panel-close{width:26px;height:26px;background:transparent;border:none;color:var(--text-muted);cursor:pointer;border-radius:4px;display:flex;align-items:center;justify-content:center}
    .info-panel-close:hover{background:var(--bg-hover);color:var(--text-primary)}
    .info-panel-body{padding:16px;overflow-y:auto;flex:1}
    .info-panel-empty{text-align:center;padding:40px 20px;color:var(--text-muted)}
    .info-panel-empty i{width:40px;height:40px;margin-bottom:12px;opacity:.6}

    .status-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:4px;font-size:12px;font-weight:500}
    .status-badge .dot{width:6px;height:6px;border-radius:50%}
    .status-running{background:rgba(22,119,255,0.15);color:#4096FF}.status-running .dot{background:#4096FF;box-shadow:0 0 6px #4096FF}
    .status-idle{background:rgba(82,196,26,0.15);color:#73D13D}.status-idle .dot{background:#73D13D}
    .status-maintenance{background:rgba(90,100,120,0.2);color:#A6B0C2}.status-maintenance .dot{background:#A6B0C2}
    .status-warning{background:rgba(250,173,20,0.15);color:#FFC53D}.status-warning .dot{background:#FFC53D;box-shadow:0 0 6px #FFC53D}

    .info-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border-color);font-size:13px}
    .info-row:last-child{border-bottom:none}
    .info-row-label{color:var(--text-secondary);display:flex;align-items:center;gap:6px}
    .info-row-value{color:var(--text-primary);font-weight:500}

    .alert-list{margin-top:12px;max-height:180px;overflow-y:auto}
    .alert-mini{padding:8px 10px;background:rgba(22,119,255,0.06);border-left:2px solid var(--brand-primary);border-radius:4px;margin-bottom:6px;font-size:12px}
    .alert-mini.high{border-left-color:var(--warning);background:rgba(250,173,20,0.08)}
    .alert-mini.critical{border-left-color:var(--danger);background:rgba(255,77,79,0.08)}
    .alert-mini-title{color:var(--text-primary);margin-bottom:2px}
    .alert-mini-time{color:var(--text-muted);font-size:11px}

    .legend-list{display:flex;flex-direction:column;gap:8px}
    .legend-item{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:rgba(22,119,255,0.05);border-radius:6px;cursor:pointer;transition:all .2s;font-size:13px}
    .legend-item:hover{background:rgba(22,119,255,0.12)}
    .legend-item.active{background:rgba(22,119,255,0.15);border-left:3px solid var(--brand-primary)}
    .legend-item-left{display:flex;align-items:center;gap:8px}
    .legend-color-box{width:14px;height:14px;border-radius:3px;border:1px solid rgba(255,255,255,0.1)}
    .legend-count{font-size:12px;color:var(--text-muted);font-weight:600}

    .stat-card-mini{background:rgba(22,119,255,0.06);border:1px solid rgba(22,119,255,0.15);border-radius:8px;padding:12px;text-align:center}
    .stat-value-mini{font-size:22px;font-weight:700;color:var(--brand-light);line-height:1.2}
    .stat-label-mini{font-size:12px;color:var(--text-secondary);margin-top:4px}

    .zoom-indicator{position:absolute;bottom:16px;left:16px;background:rgba(21,28,44,0.92);border:1px solid var(--border-color);border-radius:8px;padding:6px 12px;font-size:12px;color:var(--text-secondary);z-index:20}
    .zoom-indicator span{color:var(--brand-light);font-weight:600}
  </style>
</head>
<body>
  <div class="app-layout">
    <header class="app-header">
      <div class="header-left">
        <div class="logo-container">
          <div class="logo-icon"><i data-lucide="factory" style="width:18px;height:18px;"></i></div>
          <span class="system-title">试制资源数智化管理系统</span>
        </div>
        <nav>
          <ul class="nav-menu">
            <li class="nav-item" data-page="dashboard">综合驾驶舱</li>
            <li class="nav-item" data-page="devices">设备台账</li>
            <li class="nav-item" data-page="tasks">任务管理</li>
            <li class="nav-item" data-page="alerts">异常预警中心</li>
            <li class="nav-item active" data-page="campus">园区地图</li>
          </ul>
        </nav>
      </div>
      <div class="header-right">
        <div class="header-action" id="syncBtn"><span class="status-dot sync"></span><span>同步中</span></div>
        <div class="header-action"><span class="status-dot"></span><span>系统正常</span></div>
        <div class="header-action"><i data-lucide="clock" style="width:14px;height:14px;"></i><span id="currentTime">--:--:--</span></div>
        <div class="header-action" id="userBtn"><i data-lucide="user" style="width:14px;height:14px;"></i><span>管理员</span></div>
      </div>
    </header>

    <aside class="app-sidebar" style="display:flex;flex-direction:column;gap:12px;overflow-y:auto;padding-bottom:16px;">
      <div class="sidebar-section">
        <div class="sidebar-title" style="display:flex;align-items:center;gap:6px;"><i data-lucide="map" style="width:14px;height:14px;color:var(--brand-light);"></i>建筑分类图例</div>
        <div id="legendList" class="legend-list"></div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-title" style="display:flex;align-items:center;gap:6px;"><i data-lucide="layers" style="width:14px;height:14px;color:var(--brand-light);"></i>图层控制</div>
        <div id="layerToggles"></div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-title" style="display:flex;align-items:center;gap:6px;"><i data-lucide="bar-chart-3" style="width:14px;height:14px;color:var(--brand-light);"></i>概览统计</div>
        <div id="quickStats" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;"></div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-title" style="display:flex;align-items:center;gap:6px;"><i data-lucide="alert-triangle" style="width:14px;height:14px;color:var(--warning);"></i>最新预警</div>
        <div id="sidebarAlerts"></div>
      </div>
    </aside>

    <main class="app-main" style="padding:0;overflow:hidden;">
      <div class="campus-map-wrapper" id="campusMapWrapper">
        <svg id="campusSvg" class="campus-svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid meet"></svg>
        <div class="map-controls">
          <button class="map-ctrl-btn" id="zoomInBtn" title="放大"><i data-lucide="zoom-in" style="width:18px;height:18px;"></i></button>
          <button class="map-ctrl-btn" id="zoomOutBtn" title="缩小"><i data-lucide="zoom-out" style="width:18px;height:18px;"></i></button>
          <button class="map-ctrl-btn" id="resetViewBtn" title="重置视图"><i data-lucide="rotate-ccw" style="width:18px;height:18px;"></i></button>
          <button class="map-ctrl-btn" id="fullscreenBtn" title="全屏"><i data-lucide="maximize" style="width:18px;height:18px;"></i></button>
        </div>
        <div class="map-layer-panel">
          <div class="layer-title">图层控制</div>
          <div class="layer-toggle active" data-layer="equipment">
            <span><i data-lucide="cpu" style="width:14px;height:14px;margin-right:6px;color:var(--brand-light);"></i>设备层</span>
            <div class="layer-switch"></div>
          </div>
          <div class="layer-toggle active" data-layer="personnel">
            <span><i data-lucide="users" style="width:14px;height:14px;margin-right:6px;color:var(--brand-light);"></i>人员层</span>
            <div class="layer-switch"></div>
          </div>
          <div class="layer-toggle active" data-layer="labels">
            <span><i data-lucide="tag" style="width:14px;height:14px;margin-right:6px;color:var(--brand-light);"></i>标签层</span>
            <div class="layer-switch"></div>
          </div>
        </div>
        <div class="zoom-indicator">缩放 <span id="zoomLevel">100%</span></div>
        <div class="map-tooltip" id="mapTooltip"></div>
        <div class="info-panel" id="infoPanel" style="display:none;">
          <div class="info-panel-header">
            <div class="info-panel-title"><i data-lucide="building-2" style="width:16px;height:16px;color:var(--brand-light);"></i><span id="infoBuildingName">建筑详情</span></div>
            <button class="info-panel-close" id="infoPanelClose"><i data-lucide="x" style="width:16px;height:16px;"></i></button>
          </div>
          <div class="info-panel-body" id="infoPanelBody"></div>
        </div>
      </div>
    </main>

    <footer class="app-statusbar">
      <div class="status-group">
        <div class="status-item"><span class="status-dot"></span><span>系统运行正常</span></div>
        <div class="status-item"><i data-lucide="refresh-cw" style="width:12px;height:12px;"></i><span>数据同步完成</span></div>
      </div>
      <div class="status-group">
        <div class="status-item"><i data-lucide="database" style="width:12px;height:12px;"></i><span>数据库: 已连接</span></div>
        <div class="status-item"><i data-lucide="clock" style="width:12px;height:12px;"></i><span id="lastUpdateTime">最后更新: --:--:--</span></div>
      </div>
    </footer>
  </div>

  <script src="./assets/js/mock-data.js"></script>
  <script src="./assets/js/app.js"></script>
  <script src="./assets/js/campus-map.js"></script>
</body>
</html>
