<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>异常预警中心 - 试制资源数智化管理系统</title>
  <link rel="stylesheet" href="./assets/css/theme.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
  <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <style>
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .toast {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      min-width: 280px;
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(30px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .toast.success { border-left: 3px solid var(--success); }
    .toast.error { border-left: 3px solid var(--danger); }
    .toast.warning { border-left: 3px solid var(--warning); }
    .toast.info { border-left: 3px solid var(--brand-primary); }
    .toast-icon { flex-shrink: 0; }
    .toast.success .toast-icon { color: var(--success); }
    .toast.error .toast-icon { color: var(--danger); }
    .toast.warning .toast-icon { color: var(--warning); }
    .toast.info .toast-icon { color: var(--brand-primary); }
    .toast-icon i { width: 20px; height: 20px; }
    .toast-body { flex: 1; }
    .toast-title { font-size: 13px; font-weight: 600; color: var(--text-primary); }
    .toast-msg { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
    .toast .close-btn { color: var(--text-muted); cursor: pointer; }
    .toast .close-btn:hover { color: var(--text-primary); }

    .modal-mask {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9998;
    }
    .modal-mask.show { display: flex; }
    .modal {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      width: 90%;
      max-width: 600px;
      max-height: 85vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-color);
    }
    .modal-header h3 { font-size: 16px; font-weight: 600; color: var(--text-primary); }
    .modal-close {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      display: flex;
    }
    .modal-close:hover { background: var(--bg-hover); color: var(--text-primary); }
    .modal-body { padding: 20px; overflow-y: auto; flex: 1; }
    .modal-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    .btn {
      padding: 8px 18px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-primary { background: var(--brand-primary); color: white; }
    .btn-primary:hover { background: var(--brand-light); }
    .btn-ghost { background: transparent; color: var(--text-secondary); border: 1px solid var(--border-color); }
    .btn-ghost:hover { color: var(--text-primary); border-color: var(--text-muted); }
    .btn-danger { background: var(--danger); color: white; }
    .btn-danger:hover { background: #FF7875; }
    .btn-success { background: var(--success); color: white; }
    .btn-success:hover { background: #73D13D; }
    .btn-sm { padding: 4px 10px; font-size: 12px; }

    .modal-detail-row {
      display: flex;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-color);
      font-size: 13px;
    }
    .modal-detail-row:last-child { border-bottom: none; }
    .modal-detail-label { width: 100px; color: var(--text-secondary); flex-shrink: 0; }
    .modal-detail-value { color: var(--text-primary); flex: 1; }

    .alert-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }
    .alert-badge.critical { background: rgba(255, 77, 79, 0.15); color: #FF4D4F; }
    .alert-badge.high { background: rgba(250, 173, 20, 0.15); color: #FAAD14; }
    .alert-badge.medium { background: rgba(22, 119, 255, 0.15); color: #1677FF; }
    .alert-badge.low { background: rgba(139, 149, 168, 0.15); color: #8B95A8; }

    .alert-row {
      border-left: 3px solid transparent;
      cursor: pointer;
      transition: background 0.15s;
    }
    .alert-row:hover {
      background: var(--bg-hover);
    }
    .alert-row.critical { border-left-color: var(--danger); }
    .alert-row.high { border-left-color: var(--warning); }
    .alert-row.medium { border-left-color: var(--brand-primary); }
    .alert-row.low { border-left-color: var(--text-muted); }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 10px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 500;
    }
    .status-badge.pending { background: rgba(255, 77, 79, 0.15); color: #FF7875; }
    .status-badge.processing { background: rgba(250, 173, 20, 0.15); color: #FFC53D; }
    .status-badge.resolved { background: rgba(82, 196, 26, 0.15); color: #73D13D; }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .search-input {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 0 12px;
      height: 36px;
      min-width: 260px;
      transition: all 0.2s;
    }
    .search-input:focus-within {
      border-color: var(--brand-primary);
      box-shadow: 0 0 0 3px rgba(22, 119, 255, 0.15);
    }
    .search-input input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 13px;
      font-family: inherit;
    }
    .search-input input::placeholder { color: var(--text-muted); }
    .search-input i { color: var(--text-muted); width: 16px; height: 16px; }

    .filter-select {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 0 12px;
      height: 36px;
      font-size: 13px;
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }
    .filter-select:hover { border-color: var(--brand-primary); }
    .filter-select select {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      appearance: none;
      padding-right: 4px;
    }
    .filter-select select option { background: var(--bg-card); color: var(--text-primary); }
    .filter-select i { color: var(--text-muted); width: 14px; height: 14px; }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 16px;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }
    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--brand-primary) 0%, transparent 100%);
      opacity: 0.5;
    }
    .stat-card:hover {
      transform: translateY(-2px);
      border-color: var(--brand-primary);
    }
    .stat-card.alert-critical::before { background: linear-gradient(90deg, var(--danger) 0%, transparent 100%); opacity: 0.7; }
    .stat-card.alert-warning::before { background: linear-gradient(90deg, var(--warning) 0%, transparent 100%); opacity: 0.7; }
    .stat-card.alert-info::before { background: linear-gradient(90deg, var(--brand-primary) 0%, transparent 100%); opacity: 0.7; }
    .stat-card.alert-success::before { background: linear-gradient(90deg, var(--success) 0%, transparent 100%); opacity: 0.7; }

    .stat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .stat-title {
      color: var(--text-secondary);
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .stat-icon {
      width: 20px;
      height: 20px;
      color: var(--brand-light);
    }
    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.2;
    }
    .stat-unit {
      font-size: 14px;
      color: var(--text-secondary);
      margin-left: 4px;
    }
    .stat-sub {
      margin-top: 8px;
      font-size: 12px;
      color: var(--text-secondary);
    }
    .stat-card.alert-critical .stat-icon { color: var(--danger); }
    .stat-card.alert-warning .stat-icon { color: var(--warning); }
    .stat-card.alert-success .stat-icon { color: var(--success); }

    .level-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .level-dot.critical { background: var(--danger); box-shadow: 0 0 6px var(--danger); }
    .level-dot.high { background: var(--warning); box-shadow: 0 0 6px var(--warning); }
    .level-dot.medium { background: var(--brand-primary); box-shadow: 0 0 6px var(--brand-primary); }
    .level-dot.low { background: var(--text-muted); }

    .filter-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text-secondary);
      font-size: 13px;
    }
    .filter-option:hover { background: var(--bg-hover); color: var(--text-primary); }
    .filter-option.active {
      background: rgba(22, 119, 255, 0.15);
      color: var(--brand-light);
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .data-table thead th {
      background: var(--bg-secondary);
      color: var(--text-secondary);
      font-weight: 600;
      text-align: left;
      padding: 12px 16px;
      font-size: 12px;
      border-bottom: 1px solid var(--border-color);
      white-space: nowrap;
    }
    .data-table tbody td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-primary);
      white-space: nowrap;
    }
    .data-table tbody tr:last-child td { border-bottom: none; }
    .data-table tbody tr { transition: background 0.15s; }
    .data-table tbody tr:hover { background: var(--bg-hover); }

    .table-code {
      font-family: 'SF Mono', Consolas, monospace;
      color: var(--brand-light);
      font-weight: 600;
      font-size: 12px;
    }

    .action-link {
      background: transparent;
      border: none;
      color: var(--brand-light);
      cursor: pointer;
      font-size: 12px;
      padding: 2px 4px;
      margin-right: 4px;
      transition: color 0.15s;
      font-family: inherit;
    }
    .action-link:hover { color: var(--brand-primary); }
    .action-link.danger { color: var(--danger); }
    .action-link.danger:hover { color: #FF7875; }

    .table-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }

    .pagination {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border-top: 1px solid var(--border-color);
      background: var(--bg-secondary);
    }
    .pagination-info {
      color: var(--text-secondary);
      font-size: 13px;
    }
    .pagination-controls {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .page-btn {
      min-width: 32px;
      height: 32px;
      padding: 0 10px;
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
      font-family: inherit;
    }
    .page-btn:hover { border-color: var(--brand-primary); color: var(--brand-light); }
    .page-btn.active {
      background: var(--brand-primary);
      color: white;
      border-color: var(--brand-primary);
    }
    .page-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      color: var(--text-secondary);
      font-size: 13px;
      margin-bottom: 6px;
    }
    .form-input, .form-textarea, .form-select {
      width: 100%;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px 12px;
      color: var(--text-primary);
      font-size: 13px;
      font-family: inherit;
      transition: all 0.2s;
    }
    .form-input:focus, .form-textarea:focus, .form-select:focus {
      outline: none;
      border-color: var(--brand-primary);
      box-shadow: 0 0 0 3px rgba(22, 119, 255, 0.15);
    }
    .form-textarea { resize: vertical; min-height: 80px; }
    .form-select { appearance: none; }

    .info-section {
      background: var(--bg-secondary);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 16px;
    }
    .info-section-title {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .timeline {
      position: relative;
      padding-left: 20px;
    }
    .timeline::before {
      content: '';
      position: absolute;
      left: 6px;
      top: 4px;
      bottom: 4px;
      width: 2px;
      background: var(--border-color);
    }
    .timeline-item {
      position: relative;
      padding-bottom: 16px;
    }
    .timeline-item:last-child { padding-bottom: 0; }
    .timeline-item::before {
      content: '';
      position: absolute;
      left: -18px;
      top: 4px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--brand-primary);
      border: 2px solid var(--bg-card);
    }
    .timeline-item.time-critical::before { background: var(--danger); }
    .timeline-item.time-high::before { background: var(--warning); }
    .timeline-item.time-success::before { background: var(--success); }
    .timeline-time {
      font-size: 12px;
      color: var(--text-muted);
    }
    .timeline-content {
      font-size: 13px;
      color: var(--text-primary);
      margin-top: 2px;
    }

    .quick-assign-menu {
      position: absolute;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 4px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      min-width: 140px;
      z-index: 1000;
      max-height: 240px;
      overflow-y: auto;
    }
    .quick-assign-item {
      padding: 8px 12px;
      font-size: 13px;
      color: var(--text-primary);
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.15s;
    }
    .quick-assign-item:hover {
      background: var(--brand-primary);
      color: white;
    }

    .stat-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: var(--bg-card);
      border-radius: 6px;
      margin-bottom: 8px;
      border: 1px solid var(--border-color);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .stat-item:hover {
      border-color: var(--brand-primary);
      transform: translateX(2px);
    }
    .stat-item.active {
      border-color: var(--brand-primary);
      background: rgba(22, 119, 255, 0.1);
    }
    .stat-label { color: var(--text-secondary); font-size: 13px; }
    .stat-value-num { color: var(--brand-light); font-weight: 600; font-size: 14px; }

    .filter-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <header class="app-header">
      <div class="header-left">
        <div class="logo-container">
          <div class="logo-icon">
            <i data-lucide="factory" style="width:18px;height:18px;"></i>
          </div>
          <span class="system-title">试制资源数智化管理系统</span>
        </div>
        <nav>
          <ul class="nav-menu">
            <li class="nav-item" data-page="dashboard">综合驾驶舱</li>
            <li class="nav-item" data-page="devices">设备台账</li>
            <li class="nav-item" data-page="tasks">任务管理</li>
            <li class="nav-item active" data-page="alerts">异常预警中心</li>
          </ul>
        </nav>
      </div>
      <div class="header-right">
        <div class="header-action" id="syncBtn">
          <span class="status-dot sync"></span>
          <span>同步数据</span>
        </div>
        <div class="header-action">
          <span class="status-dot"></span>
          <span>系统正常</span>
        </div>
        <div class="header-action">
          <i data-lucide="clock" style="width:14px;height:14px;"></i>
          <span id="currentTime">--:--:--</span>
        </div>
        <div class="header-action" id="userBtn">
          <i data-lucide="user" style="width:14px;height:14px;"></i>
          <span>管理员</span>
        </div>
      </div>
    </header>

    <aside class="app-sidebar">
      <div class="sidebar-section">
        <div class="sidebar-title">预警级别分布</div>
        <div id="levelFilter"></div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-title">预警类型</div>
        <div id="typeFilter"></div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-title">处理状态</div>
        <div id="statusFilter"></div>
      </div>
    </aside>

    <main class="app-main">
      <div class="toolbar">
        <div class="toolbar-left">
          <div class="search-input">
            <i data-lucide="search"></i>
            <input type="text" id="searchInput" placeholder="搜索预警编号 / 预警描述">
          </div>
          <div class="filter-select" id="levelSelect">
            <i data-lucide="filter"></i>
            <select id="levelFilterSelect">
              <option value="all">全部级别</option>
              <option value="critical">严重</option>
              <option value="high">高</option>
              <option value="medium">中</option>
              <option value="low">低</option>
            </select>
          </div>
          <div class="filter-select" id="typeSelect">
            <i data-lucide="tag"></i>
            <select id="typeFilterSelect">
              <option value="all">全部类型</option>
              <option value="设备故障">设备故障</option>
              <option value="质量异常">质量异常</option>
              <option value="安全隐患">安全隐患</option>
              <option value="物料短缺">物料短缺</option>
              <option value="人员异常">人员异常</option>
              <option value="环境监测">环境监测</option>
            </select>
          </div>
          <div class="filter-select" id="statusSelect">
            <i data-lucide="activity"></i>
            <select id="statusFilterSelect">
              <option value="all">全部状态</option>
              <option value="未处理">未处理</option>
              <option value="处理中">处理中</option>
              <option value="已解决">已解决</option>
            </select>
          </div>
        </div>
        <div class="toolbar-right">
          <button class="btn btn-ghost" id="refreshBtn">
            <i data-lucide="refresh-cw" style="width:14px;height:14px;"></i>
            同步数据
          </button>
          <button class="btn btn-primary" id="ruleBtn">
            <i data-lucide="settings" style="width:14px;height:14px;"></i>
            规则配置
          </button>
        </div>
      </div>

      <div class="kpi-grid" id="kpiGrid" style="grid-template-columns:repeat(4,1fr);"></div>

      <div class="table-card">
        <div style="padding: 16px 16px 0; display: flex; justify-content: space-between; align-items: center;">
          <div class="card-title">
            <i data-lucide="list" class="card-title-icon"></i>
            预警列表
          </div>
          <div id="listSummary" style="color: var(--text-muted); font-size: 12px;"></div>
        </div>
        <table class="data-table">
          <thead>
            <tr>
              <th>预警编号</th>
              <th>级别</th>
              <th>类型</th>
              <th>预警描述</th>
              <th>关联设备</th>
              <th>区域</th>
              <th>状态</th>
              <th>处理人</th>
              <th>触发时间</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="alertTableBody"></tbody>
        </table>
        <div class="pagination">
          <div class="pagination-info" id="paginationInfo">共 0 条</div>
          <div class="pagination-controls" id="paginationControls"></div>
        </div>
      </div>
    </main>

    <footer class="app-statusbar">
      <div class="status-group">
        <div class="status-item">
          <span class="status-dot"></span>
          <span>系统运行正常</span>
        </div>
        <div class="status-item">
          <i data-lucide="refresh-cw" style="width:12px;height:12px;"></i>
          <span id="syncStatus">数据同步完成</span>
        </div>
      </div>
      <div class="status-group">
        <div class="status-item">
          <i data-lucide="database" style="width:12px;height:12px;"></i>
          <span>数据库: 已连接</span>
        </div>
        <div class="status-item">
          <i data-lucide="clock" style="width:12px;height:12px;"></i>
          <span id="lastUpdateTime">最后更新: --:--:--</span>
        </div>
      </div>
    </footer>
  </div>

  <script src="./assets/js/mock-data.js"></script>
  <script src="./assets/js/app.js"></script>
  <script>
    (function () {
      const d = MockData.data;
      const state = {
        page: 1,
        pageSize: 8,
        search: '',
        level: 'all',
        type: 'all',
        status: 'all',
      };

      function pad(n) { return String(n).padStart(2, '0'); }

      function updateClock() {
        const now = new Date();
        document.getElementById('currentTime').textContent =
          now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()) +
          ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
      }

      function updateLastTime() {
        const now = new Date();
        document.getElementById('lastUpdateTime').textContent =
          '最后更新: ' + pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
      }

      function statusBadge(status) {
        const map = {
          '未处理': 'pending',
          '处理中': 'processing',
          '已解决': 'resolved'
        };
        const cls = map[status] || 'pending';
        const icon = status === '未处理' ? 'circle' : status === '处理中' ? 'loader' : 'check-circle-2';
        return `<span class="status-badge ${cls}"><i data-lucide="${icon}" style="width:12px;height:12px;"></i>${status}</span>`;
      }

      function levelBadge(level, levelLabel) {
        return `<span class="alert-badge ${level}">${levelLabel}</span>`;
      }

      function renderSidebar() {
        const levelCounts = { critical: 0, high: 0, medium: 0, low: 0 };
        d.alerts.forEach(a => { levelCounts[a.level]++; });
        const levelHtml = [
          { key: 'critical', label: '严重', color: 'var(--danger)' },
          { key: 'high', label: '高', color: 'var(--warning)' },
          { key: 'medium', label: '中', color: 'var(--brand-primary)' },
          { key: 'low', label: '低', color: 'var(--text-muted)' }
        ].map(l => `
          <div class="stat-item ${state.level === l.key ? 'active' : ''}" data-level="${l.key}">
            <div style="display:flex;align-items:center;gap:8px;">
              <span class="filter-dot" style="background:${l.color};"></span>
              <span class="stat-label">${l.label}</span>
            </div>
            <span class="stat-value-num">${levelCounts[l.key]}</span>
          </div>
        `).join('') + `
          <div class="stat-item ${state.level === 'all' ? 'active' : ''}" data-level="all">
            <span class="stat-label">全部</span>
            <span class="stat-value-num">${d.alerts.length}</span>
          </div>
        `;
        document.getElementById('levelFilter').innerHTML = levelHtml;

        const typeCounts = {};
        d.alerts.forEach(a => { typeCounts[a.type] = (typeCounts[a.type] || 0) + 1; });
        const typeHtml = Object.keys(typeCounts).map(t => `
          <div class="stat-item ${state.type === t ? 'active' : ''}" data-type="${t}">
            <span class="stat-label">${t}</span>
            <span class="stat-value-num">${typeCounts[t]}</span>
          </div>
        `).join('') + `
          <div class="stat-item ${state.type === 'all' ? 'active' : ''}" data-type="all">
            <span class="stat-label">全部</span>
            <span class="stat-value-num">${d.alerts.length}</span>
          </div>
        `;
        document.getElementById('typeFilter').innerHTML = typeHtml;

        const statusCounts = { '未处理': 0, '处理中': 0, '已解决': 0 };
        d.alerts.forEach(a => { statusCounts[a.status] = (statusCounts[a.status] || 0) + 1; });
        const statusHtml = Object.keys(statusCounts).map(s => `
          <div class="stat-item ${state.status === s ? 'active' : ''}" data-status="${s}">
            <span class="stat-label">${s}</span>
            <span class="stat-value-num">${statusCounts[s]}</span>
          </div>
        `).join('') + `
          <div class="stat-item ${state.status === 'all' ? 'active' : ''}" data-status="all">
            <span class="stat-label">全部</span>
            <span class="stat-value-num">${d.alerts.length}</span>
          </div>
        `;
        document.getElementById('statusFilter').innerHTML = statusHtml;

        document.querySelectorAll('#levelFilter .stat-item').forEach(el => {
          el.addEventListener('click', () => {
            state.level = el.dataset.level;
            document.getElementById('levelFilterSelect').value = state.level;
            renderSidebar();
            renderTable();
            renderKPI();
          });
        });
        document.querySelectorAll('#typeFilter .stat-item').forEach(el => {
          el.addEventListener('click', () => {
            state.type = el.dataset.type;
            document.getElementById('typeFilterSelect').value = state.type;
            renderSidebar();
            renderTable();
          });
        });
        document.querySelectorAll('#statusFilter .stat-item').forEach(el => {
          el.addEventListener('click', () => {
            state.status = el.dataset.status;
            document.getElementById('statusFilterSelect').value = state.status;
            renderSidebar();
            renderTable();
          });
        });
      }

      function getFilteredAlerts() {
        let list = d.alerts.slice();
        if (state.search) {
          const kw = state.search.toLowerCase();
          list = list.filter(a =>
            a.id.toLowerCase().includes(kw) || a.message.toLowerCase().includes(kw)
          );
        }
        if (state.level !== 'all') list = list.filter(a => a.level === state.level);
        if (state.type !== 'all') list = list.filter(a => a.type === state.type);
        if (state.status !== 'all') list = list.filter(a => a.status === state.status);
        list.sort((a, b) => {
          const order = { critical: 0, high: 1, medium: 2, low: 3 };
          return order[a.level] - order[b.level];
        });
        return list;
      }

      function renderKPI() {
        const total = d.alerts.length;
        const unresolved = d.alerts.filter(a => a.status === '未处理').length;
        const processing = d.alerts.filter(a => a.status === '处理中').length;
        const today = new Date();
        const todayStr = today.getFullYear() + '-' + pad(today.getMonth() + 1) + '-' + pad(today.getDate());
        const todayNew = d.alerts.filter(a => a.createdAt.startsWith(todayStr)).length || Math.max(1, Math.floor(total / 5));

        const items = [
          { title: '总预警数', value: total, unit: '条', icon: 'alert-triangle', cls: 'alert-info', sub: '全部预警' },
          { title: '未处理', value: unresolved, unit: '条', icon: 'alert-octagon', cls: 'alert-critical', sub: '需要立即处理' },
          { title: '处理中', value: processing, unit: '条', icon: 'loader', cls: 'alert-warning', sub: '正在处理' },
          { title: '今日新增', value: todayNew, unit: '条', icon: 'clock', cls: 'alert-success', sub: '当日触发' }
        ];

        const html = items.map(it => `
          <div class="stat-card ${it.cls}">
            <div class="stat-header">
              <div class="stat-title">
                <i data-lucide="${it.icon}" class="stat-icon"></i>
                ${it.title}
              </div>
            </div>
            <div>
              <span class="stat-value">${it.value}</span>
              <span class="stat-unit">${it.unit}</span>
            </div>
            <div class="stat-sub">${it.sub}</div>
          </div>
        `).join('');
        document.getElementById('kpiGrid').innerHTML = html;
      }

      function renderTable() {
        const filtered = getFilteredAlerts();
        document.getElementById('listSummary').textContent = `已筛选 ${filtered.length} 条预警`;

        const total = filtered.length;
        const totalPages = Math.max(1, Math.ceil(total / state.pageSize));
        if (state.page > totalPages) state.page = totalPages;

        const start = (state.page - 1) * state.pageSize;
        const pageData = filtered.slice(start, start + state.pageSize);

        const tbody = document.getElementById('alertTableBody');
        if (pageData.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="10" style="text-align:center;padding:48px;color:var(--text-muted);">
                <i data-lucide="inbox" style="width:40px;height:40px;margin-bottom:8px;"></i>
                <div>暂无符合条件的预警数据</div>
              </td>
            </tr>
          `;
        } else {
          tbody.innerHTML = pageData.map(a => {
            const lvlCls = a.level;
            return `
              <tr class="alert-row ${lvlCls}" data-alert-id="${a.id}">
                <td><span class="table-code">${a.id}</span></td>
                <td>${levelBadge(a.level, a.levelLabel)}</td>
                <td>${a.type}</td>
                <td style="max-width:280px;overflow:hidden;text-overflow:ellipsis;">${a.message}</td>
                <td><span class="table-code">${a.device}</span></td>
                <td>${a.area}区</td>
                <td>${statusBadge(a.status)}</td>
                <td>${a.assignee}</td>
                <td style="color:var(--text-muted);font-size:12px;">${a.createdAt}</td>
                <td>
                  ${a.status === '未处理' ? `<button class="action-link" data-action="handle" data-id="${a.id}">处理</button>` : ''}
                  ${a.status !== '已解决' ? `<button class="action-link" data-action="assign" data-id="${a.id}">指派</button>` : ''}
                  <button class="action-link danger" data-action="close" data-id="${a.id}">关闭</button>
                </td>
              </tr>
            `;
          }).join('');
        }

        tbody.querySelectorAll('tr[data-alert-id]').forEach(tr => {
          tr.addEventListener('click', (e) => {
            if (e.target.closest('[data-action]')) return;
            openDetailModal(tr.dataset.alertId);
          });
        });

        tbody.querySelectorAll('[data-action]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const id = btn.dataset.id;
            const action = btn.dataset.action;
            if (action === 'handle') openHandleModal(id);
            else if (action === 'assign') openQuickAssign(btn, id);
            else if (action === 'close') closeAlert(id);
          });
        });

        renderPagination(totalPages, total);
      }

      function renderPagination(totalPages, total) {
        document.getElementById('paginationInfo').textContent = `共 ${total} 条, 第 ${state.page}/${totalPages} 页`;
        const controls = document.getElementById('paginationControls');
        let html = '';
        html += `<button class="page-btn" ${state.page === 1 ? 'disabled' : ''} data-page="prev"><i data-lucide="chevron-left" style="width:14px;height:14px;"></i></button>`;
        const maxBtn = 5;
        let startPage = Math.max(1, state.page - 2);
        let endPage = Math.min(totalPages, startPage + maxBtn - 1);
        if (endPage - startPage < maxBtn - 1) startPage = Math.max(1, endPage - maxBtn + 1);
        for (let i = startPage; i <= endPage; i++) {
          html += `<button class="page-btn ${i === state.page ? 'active' : ''}" data-page="${i}">${i}</button>`;
        }
        html += `<button class="page-btn" ${state.page === totalPages ? 'disabled' : ''} data-page="next"><i data-lucide="chevron-right" style="width:14px;height:14px;"></i></button>`;
        controls.innerHTML = html;

        controls.querySelectorAll('[data-page]').forEach(btn => {
          btn.addEventListener('click', () => {
            const p = btn.dataset.page;
            if (p === 'prev') state.page = Math.max(1, state.page - 1);
            else if (p === 'next') state.page = Math.min(totalPages, state.page + 1);
            else state.page = parseInt(p);
            renderTable();
          });
        });
      }

      function openHandleModal(alertId) {
        const alert = d.alerts.find(a => a.id === alertId);
        if (!alert) return;
        const lvlCls = alert.level;
        const html = `
          <div class="modal-mask show" id="handleModal">
            <div class="modal" style="max-width:560px;">
              <div class="modal-header">
                <h3>处理预警</h3>
                <button class="modal-close" onclick="App.closeModal('handleModal');lucide.createIcons();">
                  <i data-lucide="x"></i>
                </button>
              </div>
              <div class="modal-body">
                <div class="info-section">
                  <div class="info-section-title">预警信息</div>
                  <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
                    <span class="alert-badge ${lvlCls}">${alert.levelLabel}</span>
                    <span style="color:var(--text-primary);font-weight:500;">${alert.message}</span>
                  </div>
                  <div class="modal-detail-row"><span class="modal-detail-label">预警编号</span><span class="modal-detail-value">${alert.id}</span></div>
                  <div class="modal-detail-row"><span class="modal-detail-label">预警类型</span><span class="modal-detail-value">${alert.type}</span></div>
                  <div class="modal-detail-row"><span class="modal-detail-label">关联设备</span><span class="modal-detail-value">${alert.device}</span></div>
                  <div class="modal-detail-row"><span class="modal-detail-label">所属区域</span><span class="modal-detail-value">${alert.area}区</span></div>
                  <div class="modal-detail-row"><span class="modal-detail-label">触发时间</span><span class="modal-detail-value">${alert.createdAt}</span></div>
                </div>

                <div class="form-group">
                  <label>处理人</label>
                  <select class="form-select" id="handlerSelect">
                    <option value="">请选择处理人</option>
                    ${d.personnel.map(p => `<option value="${p.name}" ${p.name === alert.assignee ? 'selected' : ''}>${p.name} (${p.position})</option>`).join('')}
                  </select>
                </div>
                <div class="form-group">
                  <label>处理备注</label>
                  <textarea class="form-textarea" id="handleNote" placeholder="请输入处理过程描述、排查结果或修复措施..."></textarea>
                </div>
              </div>
              <div class="modal-footer">
                <button class="btn btn-ghost" onclick="App.closeModal('handleModal');lucide.createIcons();">取消</button>
                <button class="btn btn-primary" id="startHandleBtn"><i data-lucide="play" style="width:14px;height:14px;"></i>开始处理</button>
                <button class="btn btn-success" id="resolveBtn"><i data-lucide="check" style="width:14px;height:14px;"></i>标记解决</button>
              </div>
            </div>
          </div>
        `;
        document.body.insertAdjacentHTML('beforeend', html);
        App.openModal('handleModal');
        if (window.lucide) lucide.createIcons();

        document.getElementById('startHandleBtn').addEventListener('click', () => {
          const handler = document.getElementById('handlerSelect').value;
          if (!handler) { App.toast('请选择处理人', 'warning'); return; }
          alert.status = '处理中';
          alert.assignee = handler;
          App.closeModal('handleModal');
          App.toast(`已指派 ${handler} 开始处理`, 'success', '状态变更');
          renderTable();
          renderKPI();
          renderSidebar();
        });

        document.getElementById('resolveBtn').addEventListener('click', () => {
          const handler = document.getElementById('handlerSelect').value || alert.assignee;
          if (!handler) { App.toast('请选择处理人', 'warning'); return; }
          alert.status = '已解决';
          alert.assignee = handler;
          App.closeModal('handleModal');
          App.toast(`预警已解决`, 'success', '处理完成');
          renderTable();
          renderKPI();
          renderSidebar();
        });
      }

      function openDetailModal(alertId) {
        const alert = d.alerts.find(a => a.id === alertId);
        if (!alert) return;
        const lvlCls = alert.level;
        const html = `
          <div class="modal-mask show" id="detailModal">
            <div class="modal" style="max-width:640px;">
              <div class="modal-header">
                <h3>预警详情</h3>
                <button class="modal-close" onclick="App.closeModal('detailModal');lucide.createIcons();">
                  <i data-lucide="x"></i>
                </button>
              </div>
              <div class="modal-body">
                <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">
                  <span class="alert-badge ${lvlCls}" style="font-size:14px;padding:4px 12px;">${alert.levelLabel}</span>
                  <span style="color:var(--text-primary);font-weight:600;font-size:15px;">${alert.message}</span>
                  ${statusBadge(alert.status)}
                </div>

                <div class="info-section">
                  <div class="info-section-title">基础信息</div>
                  <div class="modal-detail-row"><span class="modal-detail-label">预警编号</span><span class="modal-detail-value">${alert.id}</span></div>
                  <div class="modal-detail-row"><span class="modal-detail-label">预警类型</span><span class="modal-detail-value">${alert.type}</span></div>
                  <div class="modal-detail-row"><span class="modal-detail-label">关联设备</span><span class="modal-detail-value">${alert.device}</span></div>
                  <div class="modal-detail-row"><span class="modal-detail-label">所属区域</span><span class="modal-detail-value">${alert.area}区</span></div>
                  <div class="modal-detail-row"><span class="modal-detail-label">处理人</span><span class="modal-detail-value">${alert.assignee}</span></div>
                  <div class="modal-detail-row"><span class="modal-detail-label">触发时间</span><span class="modal-detail-value">${alert.createdAt}</span></div>
                </div>

                <div class="info-section">
                  <div class="info-section-title">处理时间线</div>
                  <div class="timeline">
                    <div class="timeline-item time-critical">
                      <div class="timeline-time">${alert.createdAt}</div>
                      <div class="timeline-content">预警触发：系统检测到「${alert.message}」</div>
                    </div>
                    ${alert.status !== '未处理' ? `
                    <div class="timeline-item time-high">
                      <div class="timeline-time">${alert.createdAt}</div>
                      <div class="timeline-content">已指派给 ${alert.assignee} 处理</div>
                    </div>` : ''}
                    ${alert.status === '处理中' ? `
                    <div class="timeline-item">
                      <div class="timeline-time">进行中</div>
                      <div class="timeline-content">${alert.assignee} 正在排查处理中...</div>
                    </div>` : ''}
                    ${alert.status === '已解决' ? `
                    <div class="timeline-item time-success">
                      <div class="timeline-time">处理完成</div>
                      <div class="timeline-content">问题已解决，预警已关闭</div>
                    </div>` : ''}
                  </div>
                </div>

                <div class="info-section">
                  <div class="info-section-title">操作日志</div>
                  <div style="font-size:13px;color:var(--text-primary);">
                    <div>· [系统] 预警自动生成</div>
                    ${alert.status !== '未处理' ? `<div>· [${alert.assignee}] 接受预警任务</div>` : ''}
                    ${alert.status === '处理中' ? `<div>· [${alert.assignee}] 开始处理</div>` : ''}
                    ${alert.status === '已解决' ? `<div>· [${alert.assignee}] 标记为已解决</div>` : ''}
                  </div>
                </div>
              </div>
              <div class="modal-footer">
                <button class="btn btn-ghost" onclick="App.closeModal('detailModal');lucide.createIcons();">关闭</button>
                ${alert.status === '未处理' ? `<button class="btn btn-primary" id="detailHandleBtn"><i data-lucide="play" style="width:14px;height:14px;"></i>处理预警</button>` : ''}
                ${alert.status !== '已解决' ? `<button class="btn btn-danger" id="detailCloseBtn">关闭预警</button>` : ''}
              </div>
            </div>
          </div>
        `;
        document.body.insertAdjacentHTML('beforeend', html);
        App.openModal('detailModal');
        if (window.lucide) lucide.createIcons();

        const hBtn = document.getElementById('detailHandleBtn');
        if (hBtn) hBtn.addEventListener('click', () => {
          App.closeModal('detailModal');
          openHandleModal(alertId);
        });
        const cBtn = document.getElementById('detailCloseBtn');
        if (cBtn) cBtn.addEventListener('click', () => {
          App.closeModal('detailModal');
          closeAlert(alertId);
        });
      }

      function openQuickAssign(btn, alertId) {
        document.querySelectorAll('.quick-assign-menu').forEach(m => m.remove());
        const rect = btn.getBoundingClientRect();
        const menu = document.createElement('div');
        menu.className = 'quick-assign-menu';
        menu.style.left = rect.left + 'px';
        menu.style.top = (rect.bottom + 4 + window.scrollY) + 'px';
        menu.innerHTML = d.personnel.map(p =>
          `<div class="quick-assign-item" data-name="${p.name}">${p.name} <span style="color:var(--text-muted);font-size:11px;">· ${p.position}</span></div>`
        ).join('');
        document.body.appendChild(menu);

        const close = () => { menu.remove(); document.removeEventListener('click', close); };
        setTimeout(() => document.addEventListener('click', close), 0);

        menu.querySelectorAll('.quick-assign-item').forEach(item => {
          item.addEventListener('click', (e) => {
            e.stopPropagation();
            const name = item.dataset.name;
            const alert = d.alerts.find(a => a.id === alertId);
            if (alert) {
              alert.assignee = name;
              App.toast(`已指派给 ${name}`, 'success');
              renderTable();
            }
            menu.remove();
          });
        });
      }

      function closeAlert(alertId) {
        const alert = d.alerts.find(a => a.id === alertId);
        if (!alert) return;
        App.openConfirm({
          title: '关闭预警',
          message: `确定要关闭预警 "${alert.message}" 吗？关闭后将标记为已解决。`,
          onConfirm: () => {
            alert.status = '已解决';
            App.toast('预警已关闭', 'success');
            renderTable();
            renderKPI();
            renderSidebar();
          }
        });
      }

      function bindEvents() {
        document.getElementById('searchInput').addEventListener('input', (e) => {
          state.search = e.target.value.trim();
          state.page = 1;
          renderTable();
        });

        document.getElementById('levelFilterSelect').addEventListener('change', (e) => {
          state.level = e.target.value;
          state.page = 1;
          document.querySelectorAll('#levelFilter .stat-item').forEach(el => {
            el.classList.toggle('active', el.dataset.level === state.level);
          });
          renderTable();
          renderKPI();
        });

        document.getElementById('typeFilterSelect').addEventListener('change', (e) => {
          state.type = e.target.value;
          state.page = 1;
          document.querySelectorAll('#typeFilter .stat-item').forEach(el => {
            el.classList.toggle('active', el.dataset.type === state.type);
          });
          renderTable();
        });

        document.getElementById('statusFilterSelect').addEventListener('change', (e) => {
          state.status = e.target.value;
          state.page = 1;
          document.querySelectorAll('#statusFilter .stat-item').forEach(el => {
            el.classList.toggle('active', el.dataset.status === state.status);
          });
          renderTable();
        });

        document.getElementById('refreshBtn').addEventListener('click', () => {
          App.toast('正在同步数据...', 'info');
          setTimeout(() => {
            MockData.refresh();
            const newAlerts = MockData.data.alerts;
            d.alerts = newAlerts;
            App.toast(`同步完成, 新增 ${newAlerts.length} 条预警`, 'success');
            renderAll();
            updateLastTime();
          }, 600);
        });

        document.getElementById('syncBtn').addEventListener('click', () => {
          App.toast('同步数据中...', 'info');
          setTimeout(() => {
            MockData.refresh();
            d.alerts = MockData.data.alerts;
            App.toast('数据同步完成', 'success');
            renderAll();
            updateLastTime();
          }, 800);
        });

        document.getElementById('ruleBtn').addEventListener('click', () => {
          App.toast('跳转到规则配置页面', 'info');
        });

        document.getElementById('userBtn').addEventListener('click', () => {
          App.toast('管理员账户信息', 'info');
        });

        document.querySelectorAll('.nav-item').forEach(item => {
          item.addEventListener('click', () => {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            item.classList.add('active');
            if (item.dataset.page !== 'alerts') {
              App.toast(`跳转到 ${item.textContent} 页面`, 'info');
              document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
              document.querySelector('[data-page="alerts"]').classList.add('active');
            }
          });
        });
      }

      function renderAll() {
        renderSidebar();
        renderKPI();
        renderTable();
      }

      document.addEventListener('DOMContentLoaded', () => {
        updateClock();
        setInterval(updateClock, 1000);
        updateLastTime();
        bindEvents();
        renderAll();
        if (window.lucide) lucide.createIcons();
      });
    })();
  </script>
</body>
</html>
