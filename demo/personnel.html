<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人员看板 - 试制资源数智化管理系统</title>
<link rel="stylesheet" href="./assets/css/theme.css">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
<script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script src="./assets/js/mock-data.js"></script>
<script src="./assets/js/app.js"></script>
<style>
  .personnel-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }

  .person-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 16px;
    cursor: pointer;
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
  }
  .person-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--brand-primary) 0%, transparent 100%);
    opacity: 0.4;
  }
  .person-card:hover {
    transform: translateY(-3px);
    border-color: var(--brand-primary);
    box-shadow: 0 8px 24px rgba(22, 119, 255, 0.15);
  }
  .person-card.working::before { background: linear-gradient(90deg, #1677FF, transparent); opacity: 0.6; }
  .person-card.idle::before { background: linear-gradient(90deg, #52C41A, transparent); opacity: 0.6; }
  .person-card.offline::before { background: linear-gradient(90deg, #5A6478, transparent); opacity: 0.6; }
  .person-card.resting::before { background: linear-gradient(90deg, #FAAD14, transparent); opacity: 0.6; }

  .person-card-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }

  .avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 600;
    color: #fff;
    flex-shrink: 0;
    position: relative;
  }
  .avatar.a1 { background: linear-gradient(135deg, #1677FF, #0958D9); }
  .avatar.a2 { background: linear-gradient(135deg, #52C41A, #389E0D); }
  .avatar.a3 { background: linear-gradient(135deg, #FAAD14, #D48806); }
  .avatar.a4 { background: linear-gradient(135deg, #FF4D4F, #CF1322); }
  .avatar.a5 { background: linear-gradient(135deg, #722ED1, #531DAB); }
  .avatar.a6 { background: linear-gradient(135deg, #13C2C2, #08979C); }
  .avatar.a7 { background: linear-gradient(135deg, #EB2F96, #C41D7F); }
  .avatar.a8 { background: linear-gradient(135deg, #FA541C, #D4380D); }

  .online-indicator {
    position: absolute;
    bottom: 2px;
    right: 2px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: 2px solid var(--bg-card);
    z-index: 2;
  }
  .online-indicator.online {
    background: var(--success);
    box-shadow: 0 0 0 0 rgba(82, 196, 26, 0.6);
    animation: pulse 2s infinite;
  }
  .online-indicator.idle { background: var(--brand-primary); }
  .online-indicator.offline { background: var(--text-muted); }
  .online-indicator.resting { background: var(--warning); }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(82, 196, 26, 0.6); }
    70% { box-shadow: 0 0 0 6px rgba(82, 196, 26, 0); }
    100% { box-shadow: 0 0 0 0 rgba(82, 196, 26, 0); }
  }

  .person-info { flex: 1; min-width: 0; }
  .person-name-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 2px;
  }
  .person-name {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
  }
  .person-id {
    font-size: 12px;
    color: var(--text-muted);
    font-family: 'SF Mono', Consolas, monospace;
  }
  .person-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-secondary);
  }
  .person-meta i { width: 12px; height: 12px; }

  .person-status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 10px;
    border-radius: 9999px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }
  .person-status-badge .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
  }
  .status-working { background: rgba(22, 119, 255, 0.15); color: #4096FF; }
  .status-working .dot { background: #1677FF; animation: pulseDot 1.5s infinite; }
  .status-idle { background: rgba(82, 196, 26, 0.15); color: #73D13D; }
  .status-idle .dot { background: #52C41A; }
  .status-offline { background: rgba(90, 100, 120, 0.15); color: #8B95A8; }
  .status-offline .dot { background: #5A6478; }
  .status-resting { background: rgba(250, 173, 20, 0.15); color: #FFC53D; }
  .status-resting .dot { background: #FAAD14; }

  @keyframes pulseDot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .person-task {
    background: var(--bg-secondary);
    border-radius: var(--radius);
    padding: 10px 12px;
    margin-bottom: 10px;
    border-left: 3px solid var(--brand-primary);
    font-size: 12px;
  }
  .person-task .task-label {
    color: var(--text-muted);
    font-size: 11px;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .person-task .task-label i { width: 12px; height: 12px; }
  .person-task .task-title {
    color: var(--text-primary);
    font-weight: 500;
    margin-bottom: 4px;
  }
  .person-task .task-progress-mini {
    height: 4px;
    background: var(--bg-hover);
    border-radius: 2px;
    overflow: hidden;
  }
  .person-task .task-progress-mini .fill {
    height: 100%;
    background: linear-gradient(90deg, var(--brand-primary), var(--brand-light));
    border-radius: 2px;
  }
  .person-task.no-task {
    border-left-color: var(--border-color);
    color: var(--text-muted);
    text-align: center;
    font-style: italic;
  }

  .person-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .skill-tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    background: rgba(22, 119, 255, 0.1);
    border: 1px solid rgba(22, 119, 255, 0.2);
    border-radius: 4px;
    font-size: 11px;
    color: var(--brand-light);
    font-weight: 500;
  }

  .person-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--border-color);
  }
  .person-location {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    color: var(--text-secondary);
  }
  .person-location i { width: 12px; height: 12px; }

  /* Detail Slide Panel */
  .detail-panel-mask {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 900;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.25s, visibility 0.25s;
  }
  .detail-panel-mask.show {
    opacity: 1;
    visibility: visible;
  }
  .detail-panel {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: 460px;
    max-width: 90vw;
    background: var(--bg-card);
    border-left: 1px solid var(--border-color);
    z-index: 1000;
    transform: translateX(100%);
    transition: transform 0.3s ease;
    display: flex;
    flex-direction: column;
    box-shadow: -8px 0 32px rgba(0, 0, 0, 0.4);
  }
  .detail-panel.show {
    transform: translateX(0);
  }
  .detail-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border-color);
    background: var(--bg-secondary);
  }
  .detail-panel-header h3 {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-primary);
  }
  .detail-panel-close {
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 6px;
    border-radius: 4px;
    display: flex;
    transition: all 0.15s;
  }
  .detail-panel-close:hover {
    background: var(--bg-hover);
    color: var(--text-primary);
  }
  .detail-panel-body {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
  }
  .detail-panel-footer {
    padding: 14px 20px;
    border-top: 1px solid var(--border-color);
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    background: var(--bg-secondary);
  }

  .detail-avatar-section {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 20px;
    padding: 16px;
    background: var(--bg-secondary);
    border-radius: var(--radius-lg);
  }
  .detail-avatar-section .avatar {
    width: 64px;
    height: 64px;
    font-size: 24px;
  }
  .detail-avatar-section .avatar .online-indicator {
    width: 16px;
    height: 16px;
    bottom: 4px;
    right: 4px;
    border-width: 3px;
  }
  .detail-person-name {
    font-size: 18px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 4px;
  }
  .detail-person-meta {
    display: flex;
    gap: 12px;
    align-items: center;
    font-size: 13px;
    color: var(--text-secondary);
  }

  .work-hours-card {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 16px;
  }
  .work-hours-item {
    background: var(--bg-secondary);
    border-radius: var(--radius);
    padding: 12px;
    text-align: center;
  }
  .work-hours-item .wh-value {
    font-size: 20px;
    font-weight: 700;
    color: var(--brand-light);
    line-height: 1.2;
  }
  .work-hours-item .wh-label {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  .timeline-list {
    list-style: none;
    padding: 0;
    position: relative;
    padding-left: 20px;
  }
  .timeline-list::before {
    content: '';
    position: absolute;
    left: 6px;
    top: 4px;
    bottom: 4px;
    width: 2px;
    background: var(--border-color);
  }
  .timeline-item {
    position: relative;
    padding-bottom: 16px;
  }
  .timeline-item::before {
    content: '';
    position: absolute;
    left: -20px;
    top: 6px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--brand-primary);
    box-shadow: 0 0 0 3px rgba(22, 119, 255, 0.2);
  }
  .timeline-date {
    font-size: 12px;
    color: var(--brand-light);
    font-weight: 500;
  }
  .timeline-desc {
    font-size: 13px;
    color: var(--text-primary);
    margin-top: 2px;
  }
  .timeline-type {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .kpi-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 16px;
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
  }
  .kpi-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--brand-primary) 0%, transparent 100%);
    opacity: 0.5;
  }
  .kpi-card:hover {
    transform: translateY(-2px);
    border-color: var(--brand-primary);
    box-shadow: 0 8px 24px rgba(22, 119, 255, 0.2);
  }
  .kpi-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .kpi-title {
    color: var(--text-secondary);
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .kpi-icon {
    width: 20px;
    height: 20px;
    color: var(--brand-light);
  }
  .kpi-value {
    font-size: 28px;
    font-weight: 700;
    color: var(--text-primary);
    line-height: 1.2;
  }
  .kpi-unit {
    font-size: 14px;
    color: var(--text-secondary);
    margin-left: 4px;
  }
  .kpi-sub {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
    font-size: 12px;
    color: var(--text-secondary);
  }
  .kpi-trend {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 11px;
  }
  .kpi-trend.up { background: rgba(82, 196, 26, 0.15); color: var(--success); }
  .kpi-trend.down { background: rgba(255, 77, 79, 0.15); color: var(--danger); }
  .kpi-trend.flat { background: rgba(139, 149, 168, 0.15); color: var(--text-secondary); }

  .chart-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 16px;
  }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .card-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-title-icon {
    width: 16px;
    height: 16px;
    color: var(--brand-light);
  }
  .chart-container {
    width: 100%;
    height: 260px;
  }

  .sidebar-title {
    font-size: 12px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
    padding-left: 4px;
  }
  .sidebar-section {
    margin-bottom: 24px;
  }

  .filter-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s ease;
    color: var(--text-secondary);
    font-size: 13px;
  }
  .filter-item:hover {
    background: var(--bg-hover);
    color: var(--text-primary);
  }
  .filter-item.active {
    background: rgba(22, 119, 255, 0.15);
    color: var(--brand-light);
  }
  .filter-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  .search-input {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
    min-width: 260px;
    transition: all 0.2s;
  }
  .search-input:focus-within {
    border-color: var(--brand-primary);
    box-shadow: 0 0 0 2px rgba(22, 119, 255, 0.15);
  }
  .search-input i { width: 16px; height: 16px; color: var(--text-muted); }
  .search-input input {
    background: transparent;
    border: none;
    outline: none;
    color: var(--text-primary);
    font-size: 13px;
    flex: 1;
    min-width: 0;
    font-family: inherit;
  }
  .search-input input::placeholder { color: var(--text-muted); }

  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    margin-bottom: 16px;
    gap: 12px;
    flex-wrap: wrap;
  }
  .toolbar-left {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .toolbar-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: var(--radius);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
    white-space: nowrap;
    font-family: inherit;
  }
  .btn-primary { background: var(--brand-primary); color: #fff; }
  .btn-primary:hover { background: var(--brand-light); box-shadow: 0 4px 12px rgba(22, 119, 255, 0.3); }
  .btn-ghost { background: transparent; color: var(--text-secondary); border: 1px solid var(--border-color); }
  .btn-ghost:hover { background: var(--bg-hover); color: var(--text-primary); }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    border-radius: 4px;
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    font-size: 12px;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.15s;
  }
  .chip:hover { border-color: var(--brand-primary); color: var(--brand-light); }
  .chip.active { background: rgba(22, 119, 255, 0.15); border-color: var(--brand-primary); color: var(--brand-light); }

  .empty-state {
    grid-column: 1 / -1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
    color: var(--text-muted);
    font-size: 14px;
    gap: 12px;
  }
  .empty-state i { width: 48px; height: 48px; opacity: 0.4; }

  .toast-container {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 2000;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  @media (max-width: 1400px) {
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .charts-row { grid-template-columns: 1fr; }
  }
  @media (max-width: 1024px) {
    .app-layout {
      grid-template-columns: 1fr;
      grid-template-areas:
        "header"
        "main"
        "statusbar";
    }
    .app-sidebar { display: none; }
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .detail-panel { width: 100%; }
  }
</style>
</head>
<body>

<div class="app-layout">

  <header class="app-header">
    <div class="header-left">
      <div class="logo-container">
        <div class="logo-icon"><i data-lucide="factory" style="width:18px;height:18px;"></i></div>
        <span class="system-title">试制资源数智化管理系统</span>
      </div>
      <ul class="nav-menu">
        <li class="nav-item" onclick="location.href='index.html'">仪表盘</li>
        <li class="nav-item" onclick="location.href='equipment.html'">设备台账</li>
        <li class="nav-item" onclick="location.href='tasks.html'">任务管理</li>
        <li class="nav-item active">人员看板</li>
        <li class="nav-item" onclick="location.href='efficiency.html'">人效分析</li>
        <li class="nav-item" onclick="location.href='alerts.html'">告警管理</li>
      </ul>
    </div>
    <div class="header-right">
      <div class="header-action">
        <div class="status-dot"></div>
        <span>系统运行正常</span>
      </div>
      <div class="header-action">
        <i data-lucide="bell" style="width:16px;height:16px;"></i>
        <span>通知</span>
      </div>
      <div class="header-action">
        <i data-lucide="user" style="width:16px;height:16px;"></i>
        <span>管理员</span>
      </div>
    </div>
  </header>

  <aside class="app-sidebar">
    <div class="sidebar-section">
      <div class="sidebar-title">状态分布</div>
      <div id="statusFilters"></div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-title">区域筛选</div>
      <div id="areaFilters"></div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-title">人员来源（装配区）</div>
      <div id="sourceFilters"></div>
    </div>
  </aside>

  <main class="app-main">

    <div class="toolbar">
      <div class="toolbar-left">
        <div class="search-input">
          <i data-lucide="search"></i>
          <input type="text" id="searchInput" placeholder="搜索姓名或工号...">
        </div>
        <div id="quickFilters" style="display:flex;gap:6px;"></div>
      </div>
      <div class="toolbar-right">
        <button class="btn btn-ghost" id="btnRefresh">
          <i data-lucide="refresh-cw" style="width:14px;height:14px;"></i>
          刷新数据
        </button>
      </div>
    </div>

    <div class="kpi-grid" style="grid-template-columns: repeat(4, 1fr); margin-bottom: 16px;">
      <div class="kpi-card">
        <div class="kpi-header">
          <div class="kpi-title"><i data-lucide="users" class="kpi-icon"></i>总人数</div>
        </div>
        <div class="kpi-value" id="kpiTotal">0</div>
        <div class="kpi-sub">
          <span class="kpi-trend flat"><i data-lucide="minus" style="width:12px;height:12px;"></i>全部在册</span>
        </div>
      </div>
      <div class="kpi-card">
        <div class="kpi-header">
          <div class="kpi-title"><i data-lucide="activity" class="kpi-icon" style="color:#52C41A;"></i>在线人员</div>
        </div>
        <div class="kpi-value" id="kpiOnline" style="color:#52C41A;">0</div>
        <div class="kpi-sub">
          <span class="kpi-trend up"><i data-lucide="trending-up" style="width:12px;height:12px;"></i>实时在线</span>
        </div>
      </div>
      <div class="kpi-card">
        <div class="kpi-header">
          <div class="kpi-title"><i data-lucide="briefcase" class="kpi-icon" style="color:#1677FF;"></i>工作中</div>
        </div>
        <div class="kpi-value" id="kpiWorking" style="color:#4096FF;">0</div>
        <div class="kpi-sub">
          <span class="kpi-trend up"><i data-lucide="play" style="width:12px;height:12px;"></i>执行任务中</span>
        </div>
      </div>
      <div class="kpi-card">
        <div class="kpi-header">
          <div class="kpi-title"><i data-lucide="calendar-check" class="kpi-icon" style="color:#FAAD14;"></i>今日出勤</div>
        </div>
        <div class="kpi-value" id="kpiAttendance" style="color:#FAAD14;">0</div>
        <div class="kpi-sub">
          <span class="kpi-trend flat"><i data-lucide="clock" style="width:12px;height:12px;"></i>出勤率 <span id="attendanceRate">0%</span></span>
        </div>
      </div>
    </div>

    <div class="charts-row" style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;">
      <div class="chart-card">
        <div class="card-header">
          <div class="card-title"><i data-lucide="pie-chart" class="card-title-icon"></i>人员状态分布</div>
        </div>
        <div id="statusChart" class="chart-container"></div>
      </div>
      <div class="chart-card">
        <div class="card-header">
          <div class="card-title"><i data-lucide="bar-chart-3" class="card-title-icon"></i>人员来源统计（装配区）</div>
        </div>
        <div id="sourceChart" class="chart-container"></div>
      </div>
    </div>

    <div class="chart-card" style="padding:0;border:none;background:transparent;">
      <div class="card-header" style="padding:0 4px 12px;">
        <div class="card-title"><i data-lucide="user-cog" class="card-title-icon"></i>人员列表</div>
        <div style="display:flex;gap:8px;align-items:center;">
          <span style="font-size:12px;color:var(--text-muted);">共 <span id="personnelCount">0</span> 人</span>
        </div>
      </div>
      <div class="personnel-grid" id="personnelGrid"></div>
    </div>

  </main>

  <footer class="app-statusbar">
    <div class="status-group">
      <div class="status-item"><span class="status-dot"></span><span>人员看板管理模块</span></div>
      <div class="status-item"><span>数据实时同步</span></div>
    </div>
    <div class="status-group">
      <div class="status-item" id="currentTime"></div>
    </div>
  </footer>

</div>

<div class="detail-panel-mask" id="detailMask"></div>
<aside class="detail-panel" id="detailPanel">
  <div class="detail-panel-header">
    <h3 id="detailPanelTitle">人员详情</h3>
    <button class="detail-panel-close" id="detailPanelClose"><i data-lucide="x"></i></button>
  </div>
  <div class="detail-panel-body" id="detailPanelBody"></div>
  <div class="detail-panel-footer">
    <button class="btn btn-ghost" id="detailCloseBtn">关闭</button>
    <button class="btn btn-primary" id="detailMessageBtn">
      <i data-lucide="message-square" style="width:14px;height:14px;"></i>
      发送消息
    </button>
  </div>
</aside>

<script>
(function () {
  const SOURCES = ['商用车', '乘用车', '柳汽', '中智', '外协', '内调'];
  const ASSEMBLY_AREAS = ['SZA', 'SZB', 'SZC', 'JP1', 'JP2', 'LH', 'CX1', 'CX2'];
  const AVATAR_COLORS = ['a1','a2','a3','a4','a5','a6','a7','a8'];

  const STATUS_DEFS = {
    working: { label: '工作中', cls: 'status-working', dot: '#1677FF' },
    idle: { label: '空闲', cls: 'status-idle', dot: '#52C41A' },
    offline: { label: '离线', cls: 'status-offline', dot: '#5A6478' },
    resting: { label: '休息', cls: 'status-resting', dot: '#FAAD14' }
  };

  const state = {
    search: '',
    status: '',
    area: '',
    source: '',
    activeQuickFilter: ''
  };

  let statusChart = null;
  let sourceChart = null;

  const ENRICHED_DATA = (function () {
    const people = MockData.data.personnel.map(function (p, idx) {
      const statusKeys = ['working', 'working', 'working', 'idle', 'idle', 'offline', 'resting'];
      const statusKey = statusKeys[idx % statusKeys.length];
      const hasTask = statusKey === 'working';
      const taskTitles = [
        'CNC精密零件加工', '外壳焊接组装作业', '表面喷涂处理', '整机装配调试',
        '产品质量检测', '原料搬运调度', '电气设备维修', '机械设备保养',
        '模具打磨抛光', '样品试制加工', '工艺验证测试', '紧急订单赶制'
      ];
      const tasks = MockData.data.tasks;
      const task = hasTask ? {
        title: taskTitles[idx % taskTitles.length],
        progress: Math.floor(Math.random() * 60) + 20,
        taskId: tasks[idx % tasks.length].id
      } : null;

      const skills = [];
      skills.push(p.skillGroup);

      const todayHours = hasTask ? (6 + Math.floor(Math.random() * 3)) : (Math.floor(Math.random() * 3));
      const totalHours = todayHours + 160 + Math.floor(Math.random() * 40);

      const activities = [];
      if (hasTask) {
        activities.push({ time: '08:00', desc: '签到打卡', type: '签到' });
        activities.push({ time: '08:30', desc: '领取任务 ' + (task ? task.taskId : ''), type: '任务' });
        activities.push({ time: '09:15', desc: '开始执行：' + (task ? task.title : ''), type: '工作' });
        activities.push({ time: '12:00', desc: '午餐休息', type: '休息' });
        activities.push({ time: '13:30', desc: '恢复作业', type: '工作' });
        activities.push({ time: '15:20', desc: '完成阶段性工序', type: '完成' });
      } else if (statusKey === 'idle') {
        activities.push({ time: '08:00', desc: '签到打卡', type: '签到' });
        activities.push({ time: '09:00', desc: '设备日常巡检', type: '巡检' });
        activities.push({ time: '11:30', desc: '等待新任务分配', type: '待派工' });
      } else if (statusKey === 'resting') {
        activities.push({ time: '08:00', desc: '签到打卡', type: '签到' });
        activities.push({ time: '09:00', desc: '请假/休假中', type: '休假' });
      } else {
        activities.push({ time: '昨天 17:30', desc: '下班打卡', type: '下班' });
        activities.push({ time: '今天 08:00', desc: '未签到', type: '缺勤' });
      }

      const assemblyAreaIds = ASSEMBLY_AREAS.map(a => a.toLowerCase());
      const isAssembly = assemblyAreaIds.some(id => (p.position || '').toLowerCase().indexOf(id) !== -1 || (p.areaId || '').toUpperCase() === id.toUpperCase());
      const source = isAssembly ? SOURCES[idx % SOURCES.length] : null;

      return {
        ...p,
        statusKey: statusKey,
        statusLabel: STATUS_DEFS[statusKey].label,
        avatarColor: AVATAR_COLORS[idx % AVATAR_COLORS.length],
        task: task,
        skills: skills,
        todayHours: todayHours,
        totalHours: totalHours,
        overtimeHours: statusKey === 'working' ? Math.floor(Math.random() * 3) : 0,
        activities: activities,
        role: ['初级技工', '中级技工', '高级技工', '技师'][idx % 4],
        source: source
      };
    });
    return people;
  })();

  function getFilteredPersonnel() {
    return ENRICHED_DATA.filter(function (p) {
      if (state.search) {
        const s = state.search.toLowerCase();
        if (p.name.toLowerCase().indexOf(s) === -1 &&
            p.id.toLowerCase().indexOf(s) === -1) {
          return false;
        }
      }
      if (state.status && p.statusKey !== state.status) return false;
      if (state.area && p.position !== state.area) return false;
      if (state.source) {
        if (state.source === 'non-assembly') {
          if (p.source !== null) return false;
        } else {
          if (p.source !== state.source) return false;
        }
      }
      return true;
    });
  }

  function renderStatusFilters() {
    const container = document.getElementById('statusFilters');
    const counts = {};
    ENRICHED_DATA.forEach(function (p) {
      counts[p.statusKey] = (counts[p.statusKey] || 0) + 1;
    });

    let html = '';
    Object.keys(STATUS_DEFS).forEach(function (key) {
      const def = STATUS_DEFS[key];
      const count = counts[key] || 0;
      const active = state.status === key ? 'active' : '';
      html += '<div class="filter-item ' + active + '" data-status="' + key + '">' +
        '<span class="filter-dot" style="background:' + def.dot + ';"></span>' +
        '<span>' + def.label + '</span>' +
        '<span style="margin-left:auto;color:var(--text-muted);font-size:12px;">' + count + '</span>' +
      '</div>';
    });
    html += '<div class="filter-item ' + (state.status === '' ? 'active' : '') + '" data-status="">' +
      '<span>全部</span>' +
      '<span style="margin-left:auto;color:var(--text-muted);font-size:12px;">' + ENRICHED_DATA.length + '</span>' +
    '</div>';
    container.innerHTML = html;
    container.querySelectorAll('.filter-item').forEach(function (el) {
      el.addEventListener('click', function () {
        state.status = el.dataset.status;
        renderAll();
      });
    });
  }

  function renderAreaFilters() {
    const container = document.getElementById('areaFilters');
    const areas = {};
    ENRICHED_DATA.forEach(function (p) {
      areas[p.position] = (areas[p.position] || 0) + 1;
    });

    let html = '';
    Object.keys(areas).forEach(function (pos) {
      const active = state.area === pos ? 'active' : '';
      html += '<div class="filter-item ' + active + '" data-area="' + pos + '">' +
        '<span class="filter-dot" style="background:var(--brand-primary);"></span>' +
        '<span>' + pos + '</span>' +
        '<span style="margin-left:auto;color:var(--text-muted);font-size:12px;">' + areas[pos] + '</span>' +
      '</div>';
    });
    html += '<div class="filter-item ' + (state.area === '' ? 'active' : '') + '" data-area="">' +
      '<span>全部</span>' +
      '<span style="margin-left:auto;color:var(--text-muted);font-size:12px;">' + ENRICHED_DATA.length + '</span>' +
    '</div>';
    container.innerHTML = html;
    container.querySelectorAll('.filter-item').forEach(function (el) {
      el.addEventListener('click', function () {
        state.area = el.dataset.area;
        renderAll();
      });
    });
  }

  function renderSourceFilters() {
    const container = document.getElementById('sourceFilters');
    const counts = {};
    ENRICHED_DATA.forEach(function (p) {
      const key = p.source || 'non-assembly';
      counts[key] = (counts[key] || 0) + 1;
    });

    const sourceColors = {
      '商用车': '#1677FF',
      '乘用车': '#52C41A',
      '柳汽': '#FAAD14',
      '中智': '#722ED1',
      '外协': '#EB2F96',
      '内调': '#13C2C2',
      'non-assembly': '#8B95A8'
    };

    let html = '';
    SOURCES.forEach(function (src) {
      const count = counts[src] || 0;
      const active = state.source === src ? 'active' : '';
      html += '<div class="filter-item ' + active + '" data-source="' + src + '">' +
        '<span class="filter-dot" style="background:' + sourceColors[src] + ';"></span>' +
        '<span>' + src + '</span>' +
        '<span style="margin-left:auto;color:var(--text-muted);font-size:12px;">' + count + '</span>' +
      '</div>';
    });
    html += '<div class="filter-item ' + (state.source === 'non-assembly' ? 'active' : '') + '" data-source="non-assembly">' +
      '<span class="filter-dot" style="background:#8B95A8;"></span>' +
      '<span>非装配区</span>' +
      '<span style="margin-left:auto;color:var(--text-muted);font-size:12px;">' + (counts['non-assembly'] || 0) + '</span>' +
    '</div>';
    html += '<div class="filter-item ' + (state.source === '' ? 'active' : '') + '" data-source="">' +
      '<span>全部</span>' +
      '<span style="margin-left:auto;color:var(--text-muted);font-size:12px;">' + ENRICHED_DATA.length + '</span>' +
    '</div>';
    container.innerHTML = html;
    container.querySelectorAll('.filter-item').forEach(function (el) {
      el.addEventListener('click', function () {
        state.source = el.dataset.source;
        renderAll();
      });
    });
  }

  function renderQuickFilters() {
    const container = document.getElementById('quickFilters');
    const filters = [
      { key: '', label: '全部' },
      { key: 'working', label: '工作中' },
      { key: 'idle', label: '空闲' },
      { key: 'offline', label: '离线' },
      { key: 'resting', label: '休息' }
    ];
    let html = '';
    filters.forEach(function (f) {
      const active = state.activeQuickFilter === f.key ? 'active' : '';
      html += '<span class="chip ' + active + '" data-quick="' + f.key + '">' + f.label + '</span>';
    });
    container.innerHTML = html;
    container.querySelectorAll('.chip').forEach(function (el) {
      el.addEventListener('click', function () {
        state.activeQuickFilter = el.dataset.quick;
        state.status = el.dataset.quick;
        renderAll();
      });
    });
  }

  function renderKPIs() {
    const total = ENRICHED_DATA.length;
    const online = ENRICHED_DATA.filter(function (p) { return p.statusKey === 'working' || p.statusKey === 'idle'; }).length;
    const working = ENRICHED_DATA.filter(function (p) { return p.statusKey === 'working'; }).length;
    const attendance = ENRICHED_DATA.filter(function (p) { return p.statusKey !== 'offline'; }).length;
    const rate = total > 0 ? Math.round((attendance / total) * 100) : 0;

    document.getElementById('kpiTotal').textContent = total;
    document.getElementById('kpiOnline').textContent = online;
    document.getElementById('kpiWorking').textContent = working;
    document.getElementById('kpiAttendance').textContent = attendance;
    document.getElementById('attendanceRate').textContent = rate + '%';
  }

  function initCharts() {
    statusChart = echarts.init(document.getElementById('statusChart'), 'dark');
    sourceChart = echarts.init(document.getElementById('sourceChart'), 'dark');

    statusChart.setOption({
      backgroundColor: 'transparent',
      tooltip: {
        trigger: 'item',
        backgroundColor: 'rgba(21, 28, 44, 0.95)',
        borderColor: '#1E2A3E',
        textStyle: { color: '#fff', fontSize: 12 }
      },
      legend: {
        orient: 'vertical',
        right: 10,
        top: 'center',
        textStyle: { color: '#8B95A8', fontSize: 12 },
        itemWidth: 10,
        itemHeight: 10
      },
      series: [{
        name: '人员状态',
        type: 'pie',
        radius: ['55%', '78%'],
        center: ['35%', '50%'],
        avoidLabelOverlap: false,
        itemStyle: {
          borderRadius: 6,
          borderColor: '#151C2C',
          borderWidth: 2
        },
        label: {
          show: true,
          position: 'center',
          formatter: '{a|总人数}\n{b|' + ENRICHED_DATA.length + '}',
          rich: {
            a: { color: '#8B95A8', fontSize: 12, lineHeight: 20 },
            b: { color: '#fff', fontSize: 28, fontWeight: 700, lineHeight: 36 }
          }
        },
        emphasis: {
          label: { show: false }
        },
        labelLine: { show: false },
        data: [
          {
            value: ENRICHED_DATA.filter(function (p) { return p.statusKey === 'working'; }).length,
            name: '工作中',
            itemStyle: { color: '#1677FF' }
          },
          {
            value: ENRICHED_DATA.filter(function (p) { return p.statusKey === 'idle'; }).length,
            name: '空闲',
            itemStyle: { color: '#52C41A' }
          },
          {
            value: ENRICHED_DATA.filter(function (p) { return p.statusKey === 'resting'; }).length,
            name: '休息',
            itemStyle: { color: '#FAAD14' }
          },
          {
            value: ENRICHED_DATA.filter(function (p) { return p.statusKey === 'offline'; }).length,
            name: '离线',
            itemStyle: { color: '#5A6478' }
          }
        ]
      }]
    });

    const sourceCounts = {};
    ENRICHED_DATA.forEach(function (p) {
      const key = p.source || '非装配区';
      sourceCounts[key] = (sourceCounts[key] || 0) + 1;
    });
    const sourceNames = Object.keys(sourceCounts);
    const sourceValues = sourceNames.map(function (s) { return sourceCounts[s]; });
    const sourceColorMap = {
      '商用车': '#1677FF', '乘用车': '#52C41A', '柳汽': '#FAAD14',
      '中智': '#722ED1', '外协': '#EB2F96', '内调': '#13C2C2', '非装配区': '#8B95A8'
    };

    sourceChart.setOption({
      backgroundColor: 'transparent',
      tooltip: {
        trigger: 'axis',
        backgroundColor: 'rgba(21, 28, 44, 0.95)',
        borderColor: '#1E2A3E',
        textStyle: { color: '#fff', fontSize: 12 }
      },
      grid: { left: 50, right: 20, top: 20, bottom: 40 },
      xAxis: {
        type: 'category',
        data: sourceNames,
        axisLine: { lineStyle: { color: '#1E2A3E' } },
        axisLabel: { color: '#8B95A8', fontSize: 11, rotate: 0 }
      },
      yAxis: {
        type: 'value',
        axisLine: { lineStyle: { color: '#1E2A3E' } },
        axisLabel: { color: '#8B95A8', fontSize: 11 },
        splitLine: { lineStyle: { color: 'rgba(30, 42, 62, 0.5)' } }
      },
      series: [{
        name: '人数',
        type: 'bar',
        data: sourceNames.map(function (n) {
          return { value: sourceCounts[n], itemStyle: { color: sourceColorMap[n] || '#1677FF' } };
        }),
        barWidth: 32,
        itemStyle: { borderRadius: [4, 4, 0, 0] },
        label: { show: true, position: 'top', color: '#E2E8F0', fontSize: 11, fontWeight: 600 }
      }]
    });

    window.addEventListener('resize', function () {
      if (statusChart) statusChart.resize();
      if (sourceChart) sourceChart.resize();
    });
  }

  function renderPersonnelGrid() {
    const grid = document.getElementById('personnelGrid');
    const filtered = getFilteredPersonnel();
    document.getElementById('personnelCount').textContent = filtered.length;

    if (filtered.length === 0) {
      grid.innerHTML = '<div class="empty-state">' +
        '<i data-lucide="users"></i>' +
        '<div>暂无符合条件的人员</div>' +
      '</div>';
      if (window.lucide) lucide.createIcons();
      return;
    }

    let html = '';
    filtered.forEach(function (p) {
      html += '<div class="person-card ' + p.statusKey + '" data-id="' + p.id + '">' +
        '<div class="person-card-header">' +
          '<div class="avatar ' + p.avatarColor + '">' +
            p.avatar +
            '<span class="online-indicator ' + p.statusKey + '"></span>' +
          '</div>' +
          '<div class="person-info">' +
            '<div class="person-name-row">' +
              '<span class="person-name">' + p.name + '</span>' +
              '<span class="person-id">' + p.id + '</span>' +
            '</div>' +
            '<div class="person-meta">' +
              '<span class="person-status-badge ' + STATUS_DEFS[p.statusKey].cls + '">' +
                '<span class="dot"></span>' + p.statusLabel +
              '</span>' +
            '</div>' +
          '</div>' +
        '</div>';

      if (p.task) {
        html += '<div class="person-task">' +
          '<div class="task-label"><i data-lucide="briefcase"></i>当前任务</div>' +
          '<div class="task-title">' + p.task.title + '</div>' +
          '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;font-size:11px;color:var(--text-muted);">' +
            '<span>' + p.task.taskId + '</span>' +
            '<span>' + p.task.progress + '%</span>' +
          '</div>' +
          '<div class="task-progress-mini"><div class="fill" style="width:' + p.task.progress + '%;"></div></div>' +
        '</div>';
      } else {
        html += '<div class="person-task no-task">' +
          (p.statusKey === 'offline' ? '当前离线' : p.statusKey === 'resting' ? '休息中' : '暂无任务分配') +
        '</div>';
      }

      html += '<div class="person-tags">';
      p.skills.forEach(function (s) {
        html += '<span class="skill-tag"><i data-lucide="tag" style="width:10px;height:10px;"></i>' + s + '</span>';
      });
      html += '</div>';

      html += '<div class="person-footer">' +
        '<div class="person-location"><i data-lucide="map-pin"></i>' + p.position + '</div>' +
        '<div class="person-location"><i data-lucide="clock"></i>今日 ' + p.todayHours + 'h</div>' +
      '</div>';

      html += '</div>';
    });

    grid.innerHTML = html;
    grid.querySelectorAll('.person-card').forEach(function (card) {
      card.addEventListener('click', function () {
        const id = card.dataset.id;
        openDetailPanel(id);
      });
    });
    if (window.lucide) lucide.createIcons();
  }

  function openDetailPanel(id) {
    const p = ENRICHED_DATA.find(function (x) { return x.id === id; });
    if (!p) return;

    document.getElementById('detailPanelTitle').textContent = p.name + ' - ' + p.id;

    const def = STATUS_DEFS[p.statusKey];
    let html = '';

    html += '<div class="detail-avatar-section">' +
      '<div class="avatar ' + p.avatarColor + '" style="width:64px;height:64px;font-size:24px;">' +
        p.avatar +
        '<span class="online-indicator ' + p.statusKey + '"></span>' +
      '</div>' +
      '<div>' +
        '<div class="detail-person-name">' + p.name + '</div>' +
        '<div class="detail-person-meta">' +
          '<span class="person-status-badge ' + def.cls + '"><span class="dot"></span>' + def.label + '</span>' +
          '<span>' + p.role + '</span>' +
        '</div>' +
      '</div>' +
    '</div>';

    html += '<div class="detail-section">' +
      '<div class="detail-section-title"><i data-lucide="user"></i>基本信息</div>' +
      '<div class="detail-grid" style="grid-template-columns:1fr 1fr;gap:10px 16px;">' +
        '<div class="detail-item" style="display:flex;flex-direction:column;gap:4px;padding:10px 12px;background:var(--bg-secondary);border-radius:var(--radius);"><span class="label" style="font-size:12px;color:var(--text-muted);">工号</span><span class="value" style="font-size:13px;color:var(--text-primary);font-weight:500;">' + p.id + '</span></div>' +
        '<div class="detail-item" style="display:flex;flex-direction:column;gap:4px;padding:10px 12px;background:var(--bg-secondary);border-radius:var(--radius);"><span class="label" style="font-size:12px;color:var(--text-muted);">职位</span><span class="value" style="font-size:13px;color:var(--text-primary);font-weight:500;">' + p.role + '</span></div>' +
        (p.source ? '<div class="detail-item" style="display:flex;flex-direction:column;gap:4px;padding:10px 12px;background:var(--bg-secondary);border-radius:var(--radius);"><span class="label" style="font-size:12px;color:var(--text-muted);">人员来源（装配区）</span><span class="value" style="font-size:13px;color:var(--brand-light);font-weight:600;">' + p.source + '</span></div>' : '') +
        '<div class="detail-item" style="display:flex;flex-direction:column;gap:4px;padding:10px 12px;background:var(--bg-secondary);border-radius:var(--radius);"><span class="label" style="font-size:12px;color:var(--text-muted);">所在区域</span><span class="value" style="font-size:13px;color:var(--text-primary);font-weight:500;">' + p.position + '</span></div>' +
        '<div class="detail-item" style="display:flex;flex-direction:column;gap:4px;padding:10px 12px;background:var(--bg-secondary);border-radius:var(--radius);"><span class="label" style="font-size:12px;color:var(--text-muted);">联系电话</span><span class="value" style="font-size:13px;color:var(--text-primary);font-weight:500;">' + p.phone + '</span></div>' +
        '<div class="detail-item" style="display:flex;flex-direction:column;gap:4px;padding:10px 12px;background:var(--bg-secondary);border-radius:var(--radius);"><span class="label" style="font-size:12px;color:var(--text-muted);">入职日期</span><span class="value" style="font-size:13px;color:var(--text-primary);font-weight:500;">' + (p.joinDate ? p.joinDate.split(' ')[0] : '-') + '</span></div>' +
      '</div>' +
    '</div>';

    if (p.task) {
      html += '<div class="detail-section">' +
        '<div class="detail-section-title"><i data-lucide="briefcase"></i>当前任务</div>' +
        '<div style="background:var(--bg-secondary);border-radius:var(--radius);padding:14px;border-left:3px solid var(--brand-primary);">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">' +
            '<span style="font-size:12px;color:var(--text-muted);;">任务编号</span>' +
            '<span style="font-family:monospace;color:var(--brand-light);font-weight:600;">' + p.task.taskId + '</span>' +
          '</div>' +
          '<div style="font-size:14px;color:var(--text-primary);font-weight:500;margin-bottom:8px;">' + p.task.title + '</div>' +
          '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:12px;color:var(--text-muted);">' +
            '<span>完成进度</span>' +
            '<span style="color:var(--brand-light);font-weight:600;">' + p.task.progress + '%</span>' +
          '</div>' +
          '<div style="height:6px;background:var(--bg-hover);border-radius:3px;overflow:hidden;">' +
            '<div style="height:100%;width:' + p.task.progress + '%;background:linear-gradient(90deg,var(--brand-primary),var(--brand-light));border-radius:3px;"></div>' +
          '</div>' +
        '</div>' +
      '</div>';
    }

    html += '<div class="detail-section">' +
      '<div class="detail-section-title"><i data-lucide="tag"></i>技能标签</div>' +
      '<div class="person-tags" style="gap:8px;">';
    p.skills.forEach(function (s) {
      html += '<span class="skill-tag" style="padding:5px 12px;font-size:12px;"><i data-lucide="tag" style="width:12px;height:12px;"></i>' + s + '</span>';
    });
    html += '</div></div>';

    html += '<div class="detail-section">' +
      '<div class="detail-section-title"><i data-lucide="clock"></i>今日工时统计</div>' +
      '<div class="work-hours-card">' +
        '<div class="work-hours-item"><div class="wh-value">' + p.todayHours + 'h</div><div class="wh-label">今日工时</div></div>' +
        '<div class="work-hours-item"><div class="wh-value">' + p.overtimeHours + 'h</div><div class="wh-label">加班时长</div></div>' +
        '<div class="work-hours-item"><div class="wh-value">' + p.totalHours + 'h</div><div class="wh-label">累计工时</div></div>' +
      '</div>' +
    '</div>';

    html += '<div class="detail-section">' +
      '<div class="detail-section-title"><i data-lucide="list"></i>最近活动时间线</div>' +
      '<ul class="timeline-list">';
    p.activities.forEach(function (a) {
      html += '<li class="timeline-item">' +
        '<div class="timeline-date">' + a.time + '</div>' +
        '<div class="timeline-desc">' + a.desc + '</div>' +
        '<div class="timeline-type">类型：' + a.type + '</div>' +
      '</li>';
    });
    html += '</ul></div>';

    document.getElementById('detailPanelBody').innerHTML = html;
    document.getElementById('detailMask').classList.add('show');
    document.getElementById('detailPanel').classList.add('show');
    if (window.lucide) lucide.createIcons();
  }

  function closeDetailPanel() {
    document.getElementById('detailMask').classList.remove('show');
    document.getElementById('detailPanel').classList.remove('show');
  }

  function renderAll() {
    renderStatusFilters();
    renderAreaFilters();
    renderSourceFilters();
    renderQuickFilters();
    renderKPIs();
    renderPersonnelGrid();
  }

  function updateTime() {
    const now = new Date();
    const pad = function (n) { return n < 10 ? '0' + n : n; };
    const str = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()) + ' ' +
      pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
    document.getElementById('currentTime').textContent = str;
  }

  document.getElementById('searchInput').addEventListener('input', function (e) {
    state.search = e.target.value;
    renderPersonnelGrid();
  });

  document.getElementById('detailPanelClose').addEventListener('click', closeDetailPanel);
  document.getElementById('detailCloseBtn').addEventListener('click', closeDetailPanel);
  document.getElementById('detailMask').addEventListener('click', closeDetailPanel);

  document.getElementById('detailMessageBtn').addEventListener('click', function () {
    App.toast('发送消息功能开发中...', 'info');
  });

  document.getElementById('btnRefresh').addEventListener('click', function () {
    MockData.refresh();
    App.toast('数据已刷新');
    renderAll();
  });

  initCharts();
  renderAll();
  updateTime();
  setInterval(updateTime, 1000);
  if (window.lucide) lucide.createIcons();
})();
</script>

</body>
</html>
