<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人效分析 - 试制资源数智化管理系统</title>
<link rel="stylesheet" href="./assets/css/theme.css">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
<script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script src="./assets/js/mock-data.js"></script>
<script src="./assets/js/app.js"></script>
<style>
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 16px;
    margin-bottom: 16px;
  }

  .charts-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
  }

  .chart-container {
    width: 100%;
    height: 280px;
  }

  .sidebar-section {
    margin-bottom: 24px;
  }

  .sidebar-title {
    font-size: 12px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
    padding-left: 4px;
  }

  .filter-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s ease;
    color: var(--text-secondary);
    font-size: 13px;
  }
  .filter-item:hover {
    background: var(--bg-hover);
    color: var(--text-primary);
  }
  .filter-item.active {
    background: rgba(22, 119, 255, 0.15);
    color: var(--brand-light);
  }
  .filter-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  .date-range-selector {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .date-input-group {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
  }
  .date-input-group i { width: 14px; height: 14px; color: var(--text-muted); }
  .date-input-group input {
    background: transparent;
    border: none;
    outline: none;
    color: var(--text-primary);
    font-size: 12px;
    flex: 1;
    font-family: inherit;
    cursor: pointer;
  }
  .date-input-group input::-webkit-calendar-picker-indicator {
    filter: invert(0.7);
    cursor: pointer;
  }
  .date-quick {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }
  .date-quick .chip {
    display: inline-flex;
    align-items: center;
    padding: 4px 10px;
    border-radius: 4px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    font-size: 11px;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.15s;
  }
  .date-quick .chip:hover { border-color: var(--brand-primary); color: var(--brand-light); }
  .date-quick .chip.active { background: rgba(22, 119, 255, 0.15); border-color: var(--brand-primary); color: var(--brand-light); }

  .efficiency-table {
    width: 100%;
    border-collapse: collapse;
  }
  .efficiency-table thead th {
    padding: 12px 14px;
    text-align: left;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 1px solid var(--border-color);
    background: var(--bg-secondary);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  .efficiency-table thead th:hover { color: var(--brand-light); }
  .efficiency-table thead th.sorted-asc::after { content: ' ▲'; font-size: 10px; }
  .efficiency-table thead th.sorted-desc::after { content: ' ▼'; font-size: 10px; }
  .efficiency-table tbody td {
    padding: 12px 14px;
    font-size: 13px;
    color: var(--text-primary);
    border-bottom: 1px solid var(--border-color);
  }
  .efficiency-table tbody tr {
    cursor: pointer;
    transition: background 0.15s;
  }
  .efficiency-table tbody tr:hover { background: var(--bg-hover); }
  .efficiency-table tbody tr:last-child td { border-bottom: none; }

  .score-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 52px;
    height: 28px;
    padding: 0 10px;
    border-radius: 6px;
    font-weight: 700;
    font-size: 13px;
  }
  .score-high { background: rgba(82, 196, 26, 0.15); color: #52C41A; }
  .score-mid { background: rgba(250, 173, 20, 0.15); color: #FAAD14; }
  .score-low { background: rgba(255, 77, 79, 0.15); color: #FF4D4F; }

  .rank-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    font-weight: 700;
    font-size: 13px;
    background: var(--bg-secondary);
    color: var(--text-secondary);
  }
  .rank-badge.top1 { background: linear-gradient(135deg, #FAAD14, #D48806); color: #fff; }
  .rank-badge.top2 { background: linear-gradient(135deg, #BFBFBF, #8C8C8C); color: #fff; }
  .rank-badge.top3 { background: linear-gradient(135deg, #FA541C, #D4380D); color: #fff; }

  .progress-bar-mini {
    width: 80px;
    height: 6px;
    background: var(--bg-hover);
    border-radius: 3px;
    overflow: hidden;
    display: inline-block;
    vertical-align: middle;
    margin-right: 8px;
  }
  .progress-bar-mini .fill {
    height: 100%;
    border-radius: 3px;
  }

  .table-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    overflow: hidden;
    margin-bottom: 16px;
  }

  .team-comparison-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 16px;
    margin-bottom: 16px;
  }

  .detail-panel-mask {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 900;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.25s, visibility 0.25s;
  }
  .detail-panel-mask.show { opacity: 1; visibility: visible; }
  .detail-panel {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: 480px;
    max-width: 90vw;
    background: var(--bg-card);
    border-left: 1px solid var(--border-color);
    z-index: 1000;
    transform: translateX(100%);
    transition: transform 0.3s ease;
    display: flex;
    flex-direction: column;
    box-shadow: -8px 0 32px rgba(0, 0, 0, 0.4);
  }
  .detail-panel.show { transform: translateX(0); }
  .detail-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border-color);
    background: var(--bg-secondary);
  }
  .detail-panel-header h3 { font-size: 16px; font-weight: 600; color: var(--text-primary); }
  .detail-panel-close {
    background: transparent; border: none; color: var(--text-muted);
    cursor: pointer; padding: 6px; border-radius: 4px; display: flex; transition: all 0.15s;
  }
  .detail-panel-close:hover { background: var(--bg-hover); color: var(--text-primary); }
  .detail-panel-body { flex: 1; overflow-y: auto; padding: 20px; }
  .detail-panel-footer {
    padding: 14px 20px; border-top: 1px solid var(--border-color);
    display: flex; gap: 10px; justify-content: flex-end; background: var(--bg-secondary);
  }

  .eff-metric-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }
  .eff-metric-item {
    background: var(--bg-secondary);
    border-radius: var(--radius);
    padding: 12px;
  }
  .eff-metric-item .label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
  .eff-metric-item .value { font-size: 20px; font-weight: 700; color: var(--text-primary); }
  .eff-metric-item .sub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

  .eff-score-ring {
    width: 100px;
    height: 100px;
    margin: 0 auto;
    position: relative;
  }
  .eff-score-ring svg { transform: rotate(-90deg); }
  .eff-score-ring .ring-bg { stroke: var(--bg-hover); }
  .eff-score-ring .ring-fill { stroke-linecap: round; transition: stroke-dashoffset 0.6s ease; }
  .eff-score-ring .score-text {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .eff-score-ring .score-text .num { font-size: 28px; font-weight: 700; }
  .eff-score-ring .score-text .lbl { font-size: 12px; color: var(--text-muted); }

  .detail-section { margin-bottom: 20px; }
  .detail-section:last-child { margin-bottom: 0; }
  .detail-section-title {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border-color);
  }
  .detail-section-title i { width: 16px; height: 16px; color: var(--brand-light); }

  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    margin-bottom: 16px;
    gap: 12px;
    flex-wrap: wrap;
  }
  .toolbar-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .toolbar-right { display: flex; align-items: center; gap: 8px; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: var(--radius);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
    white-space: nowrap;
    font-family: inherit;
  }
  .btn-primary { background: var(--brand-primary); color: #fff; }
  .btn-primary:hover { background: var(--brand-light); box-shadow: 0 4px 12px rgba(22, 119, 255, 0.3); }
  .btn-ghost { background: transparent; color: var(--text-secondary); border: 1px solid var(--border-color); }
  .btn-ghost:hover { background: var(--bg-hover); color: var(--text-primary); }

  .search-input {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
    min-width: 260px;
    transition: all 0.2s;
  }
  .search-input:focus-within { border-color: var(--brand-primary); box-shadow: 0 0 0 2px rgba(22, 119, 255, 0.15); }
  .search-input i { width: 16px; height: 16px; color: var(--text-muted); }
  .search-input input {
    background: transparent; border: none; outline: none;
    color: var(--text-primary); font-size: 13px; flex: 1; min-width: 0; font-family: inherit;
  }
  .search-input input::placeholder { color: var(--text-muted); }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
    color: var(--text-muted);
    font-size: 14px;
    gap: 12px;
  }
  .empty-state i { width: 48px; height: 48px; opacity: 0.4; }

  @media (max-width: 1400px) {
    .kpi-grid { grid-template-columns: repeat(3, 1fr); }
    .charts-row { grid-template-columns: 1fr; }
  }
  @media (max-width: 1024px) {
    .app-layout {
      grid-template-columns: 1fr;
      grid-template-areas: "header" "main" "statusbar";
    }
    .app-sidebar { display: none; }
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .detail-panel { width: 100%; }
  }
</style>
</head>
<body>

<div class="app-layout">

  <header class="app-header">
    <div class="header-left">
      <div class="logo-container">
        <div class="logo-icon"><i data-lucide="factory" style="width:18px;height:18px;"></i></div>
        <span class="system-title">试制资源数智化管理系统</span>
      </div>
      <ul class="nav-menu">
        <li class="nav-item" onclick="location.href='index.html'">仪表盘</li>
        <li class="nav-item" onclick="location.href='equipment.html'">设备台账</li>
        <li class="nav-item" onclick="location.href='tasks.html'">任务管理</li>
        <li class="nav-item" onclick="location.href='personnel.html'">人员看板</li>
        <li class="nav-item active">人效分析</li>
        <li class="nav-item" onclick="location.href='alerts.html'">告警管理</li>
      </ul>
    </div>
    <div class="header-right">
      <div class="header-action">
        <div class="status-dot"></div>
        <span>系统运行正常</span>
      </div>
      <div class="header-action">
        <i data-lucide="bell" style="width:16px;height:16px;"></i>
        <span>通知</span>
      </div>
      <div class="header-action">
        <i data-lucide="user" style="width:16px;height:16px;"></i>
        <span>管理员</span>
      </div>
    </div>
  </header>

  <aside class="app-sidebar">
    <div class="sidebar-section">
      <div class="sidebar-title">日期范围</div>
      <div class="date-range-selector">
        <div class="date-input-group">
          <i data-lucide="calendar"></i>
          <input type="date" id="dateStart">
        </div>
        <div class="date-input-group">
          <i data-lucide="calendar"></i>
          <input type="date" id="dateEnd">
        </div>
        <div class="date-quick" id="dateQuick">
          <span class="chip active" data-range="7">近7天</span>
          <span class="chip" data-range="30">近30天</span>
          <span class="chip" data-range="90">近90天</span>
        </div>
      </div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-title">区域筛选</div>
      <div id="areaFilters"></div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-title">人员来源（装配区）</div>
      <div id="sourceFilters"></div>
    </div>
  </aside>

  <main class="app-main">

    <div class="toolbar">
      <div class="toolbar-left">
        <div class="search-input">
          <i data-lucide="search"></i>
          <input type="text" id="searchInput" placeholder="搜索姓名或工号...">
        </div>
      </div>
      <div class="toolbar-right">
        <button class="btn btn-ghost" id="btnExport">
          <i data-lucide="download" style="width:14px;height:14px;"></i>
          导出报表
        </button>
        <button class="btn btn-ghost" id="btnRefresh">
          <i data-lucide="refresh-cw" style="width:14px;height:14px;"></i>
          刷新数据
        </button>
      </div>
    </div>

    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-header">
          <div class="kpi-title"><i data-lucide="trending-up" class="kpi-icon"></i>人均产出</div>
        </div>
        <div class="kpi-value" id="kpiOutput">0</div>
        <div class="kpi-sub">
          <span class="kpi-trend up" id="kpiOutputTrend"><i data-lucide="trending-up" style="width:12px;height:12px;"></i>--</span>
        </div>
      </div>
      <div class="kpi-card">
        <div class="kpi-header">
          <div class="kpi-title"><i data-lucide="clock" class="kpi-icon" style="color:#FAAD14;"></i>平均工时</div>
        </div>
        <div class="kpi-value" id="kpiHours" style="color:#FAAD14;">0</div>
        <div class="kpi-sub">
          <span class="kpi-trend flat"><i data-lucide="minus" style="width:12px;height:12px;"></i>每日统计</span>
        </div>
      </div>
      <div class="kpi-card">
        <div class="kpi-header">
          <div class="kpi-title"><i data-lucide="check-circle" class="kpi-icon" style="color:#52C41A;"></i>任务完成率</div>
        </div>
        <div class="kpi-value" id="kpiCompletion" style="color:#52C41A;">0%</div>
        <div class="kpi-sub">
          <span class="kpi-trend up" id="kpiCompletionTrend"><i data-lucide="trending-up" style="width:12px;height:12px;"></i>--</span>
        </div>
      </div>
      <div class="kpi-card">
        <div class="kpi-header">
          <div class="kpi-title"><i data-lucide="alert-triangle" class="kpi-icon" style="color:#FF4D4F;"></i>返工率</div>
        </div>
        <div class="kpi-value" id="kpiRework" style="color:#FF4D4F;">0%</div>
        <div class="kpi-sub">
          <span class="kpi-trend down" id="kpiReworkTrend"><i data-lucide="trending-down" style="width:12px;height:12px;"></i>--</span>
        </div>
      </div>
      <div class="kpi-card">
        <div class="kpi-header">
          <div class="kpi-title"><i data-lucide="award" class="kpi-icon" style="color:#722ED1;"></i>综合效率指数</div>
        </div>
        <div class="kpi-value" id="kpiEfficiency" style="color:#9254DE;">0</div>
        <div class="kpi-sub">
          <span class="kpi-trend up" id="kpiEfficiencyTrend"><i data-lucide="trending-up" style="width:12px;height:12px;"></i>--</span>
        </div>
      </div>
    </div>

    <div class="charts-row">
      <div class="chart-card">
        <div class="card-header">
          <div class="card-title"><i data-lucide="bar-chart-3" class="card-title-icon"></i>工时分布（按区域/来源）</div>
        </div>
        <div id="hoursChart" class="chart-container"></div>
      </div>
      <div class="chart-card">
        <div class="card-header">
          <div class="card-title"><i data-lucide="line-chart" class="card-title-icon"></i>任务完成率趋势（近7天）</div>
        </div>
        <div id="completionChart" class="chart-container"></div>
      </div>
    </div>

    <div class="table-card">
      <div class="card-header" style="padding:16px 16px 0;">
        <div class="card-title"><i data-lucide="table" class="card-title-icon"></i>人效明细</div>
        <div style="display:flex;gap:8px;align-items:center;">
          <span style="font-size:12px;color:var(--text-muted);">共 <span id="tableCount">0</span> 条记录</span>
        </div>
      </div>
      <div style="overflow-x:auto;">
        <table class="efficiency-table" id="efficiencyTable">
          <thead>
            <tr>
              <th data-sort="name">姓名</th>
              <th data-sort="id">工号</th>
              <th data-sort="source">来源</th>
              <th data-sort="area">区域</th>
              <th data-sort="todayHours">今日工时</th>
              <th data-sort="completed">完成任务</th>
              <th data-sort="inProgress">进行中任务</th>
              <th data-sort="completionRate">完成率</th>
              <th data-sort="score">效率评分</th>
              <th data-sort="rank">排名</th>
            </tr>
          </thead>
          <tbody id="efficiencyTableBody"></tbody>
        </table>
      </div>
    </div>

    <div class="team-comparison-card">
      <div class="card-header">
        <div class="card-title"><i data-lucide="users" class="card-title-icon"></i>人员来源效率对比（装配区）</div>
      </div>
      <div id="teamChart" class="chart-container" style="height:320px;"></div>
    </div>

  </main>

  <footer class="app-statusbar">
    <div class="status-group">
      <div class="status-item"><span class="status-dot"></span><span>人效分析模块</span></div>
      <div class="status-item"><span>数据实时同步</span></div>
    </div>
    <div class="status-group">
      <div class="status-item" id="currentTime"></div>
    </div>
  </footer>

</div>

<div class="detail-panel-mask" id="detailMask"></div>
<aside class="detail-panel" id="detailPanel">
  <div class="detail-panel-header">
    <h3 id="detailPanelTitle">人效详情</h3>
    <button class="detail-panel-close" id="detailPanelClose"><i data-lucide="x"></i></button>
  </div>
  <div class="detail-panel-body" id="detailPanelBody"></div>
  <div class="detail-panel-footer">
    <button class="btn btn-ghost" id="detailCloseBtn">关闭</button>
    <button class="btn btn-primary" id="detailExportBtn">
      <i data-lucide="download" style="width:14px;height:14px;"></i>
      导出报表
    </button>
  </div>
</aside>

<script>
(function () {
  const SOURCES = ['商用车', '乘用车', '柳汽', '中智', '外协', '内调'];
  const ASSEMBLY_AREAS = ['SZA', 'SZB', 'SZC', 'JP1', 'JP2', 'LH', 'CX1', 'CX2'];
  const AVATAR_COLORS = ['a1','a2','a3','a4','a5','a6','a7','a8'];

  const state = {
    search: '',
    area: '',
    source: '',
    dateRange: 7,
    sortKey: 'score',
    sortDir: 'desc'
  };

  let hoursChart = null;
  let completionChart = null;
  let teamChart = null;

  const EFFICIENCY_DATA = (function () {
    const people = MockData.data.personnel;
    const tasks = MockData.data.tasks;

    return people.map(function (p, idx) {
      const personTasks = tasks.filter(function (t) { return t.assignee === p.name; });
      const completed = personTasks.filter(function (t) { return t.status === '已完成'; }).length;
      const inProgress = personTasks.filter(function (t) { return t.status === '执行中' || t.status === '待执行'; }).length;
      const total = personTasks.length;
      const completionRate = total > 0 ? Math.round((completed / total) * 100) : 70;

      const todayHours = 4 + Math.floor(Math.random() * 5);
      const totalHours = todayHours + 160 + Math.floor(Math.random() * 40);
      const outputPerHour = (5 + Math.random() * 15).toFixed(1);
      const reworkRate = total > 0 ? Math.round(Math.random() * 8) : Math.floor(Math.random() * 5);

      let score = 60 + Math.floor(Math.random() * 40);
      score = Math.min(100, score + Math.floor(completionRate / 20));
      score = Math.max(40, score - reworkRate);

      const assemblyAreaIds = ASSEMBLY_AREAS.map(a => a.toLowerCase());
      const isAssembly = assemblyAreaIds.some(id => (p.position || '').toLowerCase().indexOf(id) !== -1);
      const source = isAssembly ? SOURCES[idx % SOURCES.length] : null;

      return {
        ...p,
        avatarColor: AVATAR_COLORS[idx % AVATAR_COLORS.length],
        source: source,
        todayHours: todayHours,
        totalHours: totalHours,
        completed: completed,
        inProgress: inProgress,
        totalTasks: total,
        completionRate: completionRate,
        outputPerHour: parseFloat(outputPerHour),
        reworkRate: reworkRate,
        score: score,
        efficiencyIndex: (score / 10).toFixed(1),
        tasksDetail: personTasks
      };
    });
  })();

  function getFilteredData() {
    return EFFICIENCY_DATA.filter(function (p) {
      if (state.search) {
        const s = state.search.toLowerCase();
        if (p.name.toLowerCase().indexOf(s) === -1 &&
            p.id.toLowerCase().indexOf(s) === -1) {
          return false;
        }
      }
      if (state.area && p.position !== state.area) return false;
      if (state.source) {
        if (state.source === 'non-assembly') {
          if (p.source !== null) return false;
        } else {
          if (p.source !== state.source) return false;
        }
      }
      return true;
    });
  }

  function getSortedData(data) {
    const key = state.sortKey;
    const dir = state.sortDir === 'desc' ? -1 : 1;
    return data.slice().sort(function (a, b) {
      let va = a[key], vb = b[key];
      if (typeof va === 'string') return va.localeCompare(vb, 'zh') * dir;
      return (va - vb) * dir;
    });
  }

  function computeRanks(data) {
    const sorted = data.slice().sort(function (a, b) { return b.score - a.score; });
    const rankMap = {};
    sorted.forEach(function (p, i) { rankMap[p.id] = i + 1; });
    return data.map(function (p) { return { ...p, rank: rankMap[p.id] }; });
  }

  function renderKPIs() {
    const filtered = getFilteredData();
    const total = filtered.length;
    const totalOutput = filtered.reduce(function (s, p) { return s + p.completed * p.outputPerHour; }, 0);
    const avgOutput = total > 0 ? (totalOutput / total).toFixed(1) : '0';
    const avgHours = total > 0 ? (filtered.reduce(function (s, p) { return s + p.todayHours; }, 0) / total).toFixed(1) : '0';
    const totalTasks = filtered.reduce(function (s, p) { return s + p.completed + p.inProgress; }, 0);
    const completedTasks = filtered.reduce(function (s, p) { return s + p.completed; }, 0);
    const completionRate = totalTasks > 0 ? Math.round((completedTasks / totalTasks) * 100) : 0;
    const avgRework = total > 0 ? (filtered.reduce(function (s, p) { return s + p.reworkRate; }, 0) / total).toFixed(1) : '0';
    const avgScore = total > 0 ? Math.round(filtered.reduce(function (s, p) { return s + p.score; }, 0) / total) : 0;

    document.getElementById('kpiOutput').innerHTML = avgOutput + ' <span style="font-size:14px;color:var(--text-secondary);">件/人</span>';
    document.getElementById('kpiHours').innerHTML = avgHours + ' <span style="font-size:14px;color:var(--text-secondary);">h</span>';
    document.getElementById('kpiCompletion').textContent = completionRate + '%';
    document.getElementById('kpiRework').textContent = avgRework + '%';
    document.getElementById('kpiEfficiency').textContent = avgScore;

    document.getElementById('kpiOutputTrend').innerHTML = '<i data-lucide="trending-up" style="width:12px;height:12px;"></i>+' + (Math.random() * 10 + 1).toFixed(1) + '%';

      '<div style="display:flex;align-items:center;gap:16px;margin-bottom:16px;">' +
        '<div class="eff-score-ring">' +
          '<svg width="100" height="100">' +
            '<circle class="ring-bg" cx="50" cy="50" r="45" stroke-width="8" fill="none"/>' +
            '<circle class="ring-fill" cx="50" cy="50" r="45" stroke-width="8" fill="none"' +
              'stroke="' + ringColor + '"' +
              'stroke-dasharray="' + circumference + '"' +
              'stroke-dashoffset="' + offset + '"/>' +
          '</svg>' +
          '<div class="score-text">' +
            '<div class="num" style="color:' + ringColor + ';">' + p.score + '</div>' +
            '<div class="lbl">效率评分</div>' +
          '</div>' +
        '</div>' +
        '<div style="flex:1;">' +
          '<div style="font-size:18px;font-weight:600;color:var(--text-primary);margin-bottom:6px;">' + p.name + '</div>' +
          '<div style="font-size:12px;color:var(--text-muted);margin-bottom:8px;">' + p.id + ' · ' + p.position + (p.source ? ' · 来源：' + p.source : '') + '</div>' +
          '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">' +
            '<span class="score-badge ' + scoreCls + '">' + scoreLabel + '</span>' +
            '<span class="rank-badge ' + rankCls + '">#' + rank + '</span>' +
            '<span style="font-size:12px;color:var(--text-secondary);">完成率 <span style="color:' + progressColor + ';font-weight:600;">' + p.completionRate + '%</span></span>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>';

    html += '<div class="detail-section">' +
      '<div class="detail-section-title"><i data-lucide="gauge"></i>效率指标</div>' +
      '<div class="eff-metric-row">' +
        '<div class="eff-metric-item"><div class="label">综合效率指数</div><div class="value" style="color:#9254DE;">' + p.efficiencyIndex + '</div><div class="sub">基准 10.0</div></div>' +
        '<div class="eff-metric-item"><div class="label">今日工时</div><div class="value" style="color:#FAAD14;">' + p.todayHours + 'h</div><div class="sub">月度 ' + p.totalHours + 'h</div></div>' +
        '<div class="eff-metric-item"><div class="label">完成任务</div><div class="value" style="color:#52C41A;">' + p.completed + '</div><div class="sub">共 ' + p.totalTasks + ' 项</div></div>' +
        '<div class="eff-metric-item"><div class="label">进行中</div><div class="value" style="color:#1677FF;">' + p.inProgress + '</div><div class="sub">待处理</div></div>' +
        '<div class="eff-metric-item"><div class="label">返工率</div><div class="value" style="color:#FF4D4F;">' + p.reworkRate + '%</div><div class="sub">行业均值 5%</div></div>' +
        '<div class="eff-metric-item"><div class="label">人均产出</div><div class="value" style="color:#4096FF;">' + p.outputPerHour + '/h</div><div class="sub">件/小时</div></div>' +
      '</div>' +
    '</div>';

    html += '<div class="detail-section">' +
      '<div class="detail-section-title"><i data-lucide="list-checks"></i>任务明细</div>' +
      '<div style="display:flex;flex-direction:column;gap:8px;">';

    if (p.tasksDetail && p.tasksDetail.length > 0) {
      p.tasksDetail.slice(0, 5).forEach(function (t) {
        const statusColor = t.status === '已完成' ? '#52C41A' : t.status === '执行中' ? '#1677FF' : t.status === '已延期' ? '#FF4D4F' : '#8B95A8';
        html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--bg-secondary);border-radius:var(--radius);border-left:3px solid ' + statusColor + ';">' +
          '<div style="flex:1;min-width:0;">' +
            '<div style="font-size:13px;color:var(--text-primary);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + t.title + '</div>' +
            '<div style="font-size:11px;color:var(--text-muted);margin-top:2px;">' + t.id + ' · ' + t.type + '</div>' +
          '</div>' +
          '<span style="font-size:11px;color:' + statusColor + ';font-weight:600;white-space:nowrap;margin-left:8px;">' + t.status + '</span>' +
        '</div>';
      });
    } else {
      html += '<div style="text-align:center;padding:16px;color:var(--text-muted);font-size:13px;">暂无任务记录</div>';
    }

    html += '</div></div>';

    html += '<div class="detail-section">' +
      '<div class="detail-section-title"><i data-lucide="user"></i>基本信息</div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">' +
        '<div style="padding:10px 12px;background:var(--bg-secondary);border-radius:var(--radius);"><div style="font-size:12px;color:var(--text-muted);">工号</div><div style="font-size:13px;color:var(--text-primary);font-weight:500;margin-top:2px;">' + p.id + '</div></div>' +
        '<div style="padding:10px 12px;background:var(--bg-secondary);border-radius:var(--radius);"><div style="font-size:12px;color:var(--text-muted);">所在区域</div><div style="font-size:13px;color:var(--text-primary);font-weight:500;margin-top:2px;">' + p.position + '</div></div>' +
        (p.source ? '<div style="padding:10px 12px;background:var(--bg-secondary);border-radius:var(--radius);"><div style="font-size:12px;color:var(--text-muted);">人员来源（装配区）</div><div style="font-size:13px;color:var(--brand-light);font-weight:600;margin-top:2px;">' + p.source + '</div></div>' : '') +
        '<div style="padding:10px 12px;background:var(--bg-secondary);border-radius:var(--radius);"><div style="font-size:12px;color:var(--text-muted);">技能工种</div><div style="font-size:13px;color:var(--text-primary);font-weight:500;margin-top:2px;">' + p.skillGroup + '</div></div>' +
      '</div>' +
    '</div>';

    document.getElementById('detailPanelBody').innerHTML = html;
    document.getElementById('detailMask').classList.add('show');
    document.getElementById('detailPanel').classList.add('show');
    if (window.lucide) lucide.createIcons();
  }

  function closeDetailPanel() {
    document.getElementById('detailMask').classList.remove('show');
    document.getElementById('detailPanel').classList.remove('show');
  }

  function renderAll() {
    renderAreaFilters();
    renderSourceFilters();
    renderDateRange();
    renderKPIs();
    renderHoursChart();
    renderCompletionChart();
    renderTable();
    renderTeamChart();
  }

  function updateTime() {
    const now = new Date();
    const pad = function (n) { return n < 10 ? '0' + n : '' + n; };
    const str = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()) + ' ' +
      pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
    document.getElementById('currentTime').textContent = str;
  }

  document.getElementById('searchInput').addEventListener('input', function (e) {
    state.search = e.target.value;
    renderKPIs();
    renderHoursChart();
    renderCompletionChart();
    renderTable();
    renderTeamChart();
  });

  document.getElementById('dateStart').addEventListener('change', function (e) {
    const diff = Math.floor((new Date() - new Date(e.target.value)) / (1000 * 60 * 60 * 24));
    state.dateRange = Math.max(1, diff);
    renderDateRange();
    renderAll();
  });

  document.getElementById('dateEnd').addEventListener('change', function (e) {
    state.dateRange = Math.floor((new Date(e.target.value) - new Date()) / (1000 * 60 * 60 * 24)) + 1;
    renderDateRange();
    renderAll();
  });

  document.querySelectorAll('#dateQuick .chip').forEach(function (el) {
    el.addEventListener('click', function () {
      state.dateRange = parseInt(el.dataset.range);
      renderDateRange();
      renderAll();
    });
  });

  document.getElementById('detailPanelClose').addEventListener('click', closeDetailPanel);
  document.getElementById('detailCloseBtn').addEventListener('click', closeDetailPanel);
  document.getElementById('detailMask').addEventListener('click', closeDetailPanel);

  document.getElementById('detailExportBtn').addEventListener('click', function () {
    App.toast('报表导出功能开发中...', 'info');
  });

  document.getElementById('btnExport').addEventListener('click', function () {
    App.toast('报表导出功能开发中...', 'info');
  });

  document.getElementById('btnRefresh').addEventListener('click', function () {
    MockData.refresh();
    App.toast('数据已刷新');
    renderAll();
  });

  initCharts();
  renderAll();
  updateTime();
  setInterval(updateTime, 1000);
  if (window.lucide) lucide.createIcons();
})();
</script>

</body>
</html>
